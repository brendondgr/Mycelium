# Mycelium instance configuration.
#
# Generated by `ops/mycelium config init`. Edit freely: every value here
# overrides the profile it started from, and an environment variable of
# the name shown overrides this file. Secrets (API keys, passwords, the
# sign-up access code) belong in .env, never here.
#
# `ops/mycelium config show` prints what is in effect and why;
# `ops/mycelium config validate` checks the combination works.

# Which deployment profile this instance starts from.
[instance]
# Who this instance serves. Sets the starting value of every other key;
# anything below overrides it.
profile = "lab"                          # env MYCELIUM_PROFILE; personal | lab | department | institution

# Subscriptions are a self-contained module: with mode = "off" nothing about
# plans, tiers or seats applies.
[billing]
# off: no plans, tiers or seats; everyone gets [limits] and labs and
# departments start active. subscriptions: today's tiered plans, seats and the
# [limits.tiers.*] numbers.
mode = "off"                             # env BILLING_MODE; off | subscriptions
# Under subscriptions, let a tier withhold features (LLM scoring, reports,
# team workspace...). Off grants every feature to everyone and keeps only the
# tier limits.
enforce_features = false                 # env BILLING_ENFORCE_ENTITLEMENTS
# Under subscriptions, the personal tier a new account starts on.
signup_tier = "spore"                    # env SIGNUP_GRANT_TIER; free | spore

# Per-person and per-organization limits while billing is off. "unlimited" or
# a number; a number turns that one limit on.
[limits]
# Interest clusters per person. Mylo runs one literature search per cluster
# each night.
clusters = "unlimited"                   # suggested: 6; env LIMIT_CLUSTERS
# Search terms per cluster.
topics_per_cluster = "unlimited"         # suggested: 10; env LIMIT_TOPICS_PER_CLUSTER
# Watch topics per person, across all clusters.
watch_topics = "unlimited"               # suggested: 20; env LIMIT_WATCH_TOPICS
# Active personal projects per person (each is scored nightly).
personal_projects = "unlimited"          # suggested: 5; env LIMIT_PERSONAL_PROJECTS
# Active projects per lab. Applies under subscriptions too.
lab_projects = "unlimited"               # suggested: 10; env LIMIT_LAB_PROJECTS
# Active projects per department. Applies under subscriptions too.
department_projects = "unlimited"        # suggested: 30; env LIMIT_DEPARTMENT_PROJECTS
# Members per lab.
lab_members = "unlimited"                # suggested: 15; env LIMIT_LAB_MEMBERS
# PIs (lab leads) per lab.
lab_leads = "unlimited"                  # suggested: 5; env LIMIT_LAB_LEADS

# Per-tier limits, used only when billing.mode = "subscriptions".
[limits.tiers.free]
clusters = 3
topics_per_cluster = 2
watch_topics = 6
personal_projects = 2
members = 1
leads = 1

[limits.tiers.spore]
clusters = 6
topics_per_cluster = 10
watch_topics = 20
personal_projects = 5
members = 1
leads = 1

[limits.tiers.lab]
clusters = 6
topics_per_cluster = 15
watch_topics = 15
personal_projects = 5
members = 15
leads = 5

[limits.tiers.canopy]
clusters = 6
topics_per_cluster = 15
watch_topics = 15
personal_projects = 5
members = "unlimited"
leads = "unlimited"

# Who can create an account, and whether email must be verified.
[signup]
# closed: only an admin creates accounts. invite: an invite link or email from
# someone inside. code: the shared access code in .env (SIGNUP_ACCESS_CODE),
# or an invite. domain: any address at signup.allowed_domains, or an invite
# (needs email). open: anyone.
mode = "invite"                          # env SIGNUP_MODE; closed | invite | code | domain | open
# Email domains admitted by signup.mode = "domain", e.g. ["fsu.edu"]. A
# subdomain of a listed domain counts.
allowed_domains = []                     # env SIGNUP_ALLOWED_DOMAINS
# Mail a code that must be answered before an account can create a lab or
# department or invite people. Needs an [email] provider. Off: accounts are
# active as soon as they exist.
verify_email = false                     # env SIGNUP_VERIFY_EMAIL
# Refuse sign-up from an address that matches no known institution (invited
# addresses are exempt).
require_institution_email = false        # env SIGNUP_REQUIRE_INSTITUTION_EMAIL

# How mail leaves the instance. Keys and passwords stay in .env.
[email]
# none: mail is printed to the backend log, never sent. resend: the Resend API
# (RESEND_API_KEY in .env). smtp: any SMTP server (EMAIL_HOST_PASSWORD in
# .env).
provider = "none"                        # env EMAIL_PROVIDER; none | resend | smtp
# The From address. Its domain must be verified with your provider.
from = "Mycelium <mycelium@localhost>"   # env DEFAULT_FROM_EMAIL
# Optional Reply-To. Blank means replies go to the From address.
reply_to = ""                            # env EMAIL_REPLY_TO
# SMTP server host.
smtp_host = ""                           # env EMAIL_HOST
# SMTP server port.
smtp_port = 587                          # env EMAIL_PORT
# SMTP user name.
smtp_user = ""                           # env EMAIL_HOST_USER
# Use STARTTLS for SMTP.
smtp_tls = true                          # env EMAIL_USE_TLS

# Optional features, all off unless switched on.
[features]
# Mylo listens in consenting Discord/Slack channels to keep profiles current.
ambient = false                          # env AMBIENT_ENABLED
# Nightly reasoning over what was heard (needs features.ambient).
ambient_deliberate = false               # env AMBIENT_DELIBERATE_ENABLED
# Let confirmed explorations join a person's paper search.
ambient_drift = false                    # env AMBIENT_DRIFT_ENABLED
# Accept uploaded meeting transcripts as evidence.
ambient_transcripts = false              # env AMBIENT_TRANSCRIPTS_ENABLED
# Outward collaborator search across consenting people.
collab_search = false                    # env COLLAB_SEARCH_ENABLED
# Alerts when a finding bears on a project.
project_alerts = false                   # env PROJECT_ALERTS_ENABLED
# Discord threads for newly fitting grants, fellowships, conferences.
announcements = false                    # env OPPORTUNITY_ANNOUNCEMENTS_ENABLED
# Out-of-band messages for exceptionally strong matches.
high_signal = false                      # env HIGH_SIGNAL_DELIVERY_ENABLED
# Rerank each slate's head with a second model.
rerank = false                           # env RERANK_ENABLED
# The Slack integration.
slack = false                            # env SLACK_ENABLED
# The Microsoft Teams integration.
teams = false                            # env TEAMS_ENABLED

# The modular tools under tools/. These keys govern all of them; each
# installed tool also reads its own [tools.<name>] section below.
[tools]
# Stop startup when any tool fails to load, instead of setting the broken tool
# (and whatever depends on it) aside. Tests and CI turn this on.
strict = false                           # env MYCELIUM_TOOLS_STRICT
# Tools to keep switched off without deleting their folders, e.g.
# ["screening"]. A core tool cannot be disabled.
disabled = []                            # env MYCELIUM_TOOLS_DISABLED

# Cost controls for the nightly run: how many model calls and how much
# parallelism it may use.
[nightly]
# Most language-model calls one nightly run may make. Past it the run keeps
# ranking without model write-ups.
model_calls = "unlimited"                # suggested: 5000; env NIGHTLY_MODEL_CALLS
# Opportunity-scoring calls in flight at once.
llm_concurrency = 32                     # env OPPORTUNITY_LLM_CONCURRENCY
# Paper and opportunity write-up calls in flight at once.
writeup_concurrency = 32                 # env WRITEUP_LLM_CONCURRENCY
# Rerank calls in flight at once.
rerank_concurrency = 12                  # env TYPESAFE_RERANK_CONCURRENCY
# Write-ups per theme per target per night.
cluster_writeup_budget = 40              # env CLUSTER_WRITEUP_BUDGET
# Model-written 'who is this for' lines per lab feed.
member_fit_llm_limit = 10                # env MEMBER_FIT_LLM_LIMIT
# People's own papers read into the knowledge graph per night.
knowledge_work_facets = 200              # env KNOWLEDGE_WORK_FACETS_NIGHTLY_CAP
# OpenAlex field lookups per night.
knowledge_field_lookups = 200            # env KNOWLEDGE_FIELD_LOOKUPS_NIGHTLY_CAP
# Funding calls read for team requirements per night.
collab_slots = 200                       # env COLLAB_SLOTS_NIGHTLY_CAP
# Conversations read per lab per day.
ambient_extract_per_lab = 200            # env AMBIENT_EXTRACT_DAILY_CAP_PER_LAB
# Conversation reads in flight at once.
ambient_extract_concurrency = 8          # env AMBIENT_EXTRACT_CONCURRENCY
# Profile-change explanations written per night.
ambient_explain = 200                    # env AMBIENT_EXPLAIN_NIGHTLY_CAP
