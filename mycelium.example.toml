# Mycelium instance configuration.
#
# Generated by `ops/mycelium config init`. Edit freely: every value here
# overrides the profile it started from, and an environment variable of
# the name shown overrides this file. Secrets (API keys, passwords, the
# sign-up access code) belong in .env, never here.
#
# `ops/mycelium config show` prints what is in effect and why;
# `ops/mycelium config validate` checks the combination works.

# Which deployment profile this instance starts from.
[instance]
# Who this instance serves. Sets the starting value of every other key;
# anything below overrides it.
profile = "lab"                          # env MYCELIUM_PROFILE; personal | lab | department | institution

# Subscriptions are a self-contained module: with mode = "off" nothing about
# plans, tiers or seats applies.
[billing]
# off: no plans, tiers or seats; everyone gets [limits] and labs and
# departments start active. subscriptions: today's tiered plans, seats and the
# [limits.tiers.*] numbers.
mode = "off"                             # env BILLING_MODE; off | subscriptions
# Under subscriptions, let a tier withhold features (LLM scoring, reports,
# team workspace...). Off grants every feature to everyone and keeps only the
# tier limits.
enforce_features = false                 # env BILLING_ENFORCE_ENTITLEMENTS
# Under subscriptions, the personal tier a new account starts on.
signup_tier = "spore"                    # env SIGNUP_GRANT_TIER; free | spore

# Per-person and per-organization limits while billing is off. "unlimited" or
# a number; a number turns that one limit on.
[limits]
# Interest clusters per person. Mylo runs one literature search per cluster
# each night.
clusters = "unlimited"                   # suggested: 6; env LIMIT_CLUSTERS
# Search terms per cluster.
topics_per_cluster = "unlimited"         # suggested: 10; env LIMIT_TOPICS_PER_CLUSTER
# Watch topics per person, across all clusters.
watch_topics = "unlimited"               # suggested: 20; env LIMIT_WATCH_TOPICS
# Active personal projects per person (each is scored nightly).
personal_projects = "unlimited"          # suggested: 5; env LIMIT_PERSONAL_PROJECTS
# Active projects per lab. Applies under subscriptions too.
lab_projects = "unlimited"               # suggested: 10; env LIMIT_LAB_PROJECTS
# Active projects per department. Applies under subscriptions too.
department_projects = "unlimited"        # suggested: 30; env LIMIT_DEPARTMENT_PROJECTS
# Members per lab.
lab_members = "unlimited"                # suggested: 15; env LIMIT_LAB_MEMBERS
# PIs (lab leads) per lab.
lab_leads = "unlimited"                  # suggested: 5; env LIMIT_LAB_LEADS

# Per-tier limits, used only when billing.mode = "subscriptions".
[limits.tiers.free]
clusters = 3
topics_per_cluster = 2
watch_topics = 6
personal_projects = 2
members = 1
leads = 1

[limits.tiers.spore]
clusters = 6
topics_per_cluster = 10
watch_topics = 20
personal_projects = 5
members = 1
leads = 1

[limits.tiers.lab]
clusters = 6
topics_per_cluster = 15
watch_topics = 15
personal_projects = 5
members = 15
leads = 5

[limits.tiers.canopy]
clusters = 6
topics_per_cluster = 15
watch_topics = 15
personal_projects = 5
members = "unlimited"
leads = "unlimited"

# Who can create an account, and whether email must be verified.
[signup]
# closed: only an admin creates accounts. invite: an invite link or email from
# someone inside. code: the shared access code in .env (SIGNUP_ACCESS_CODE),
# or an invite. domain: any address at signup.allowed_domains, or an invite
# (needs email). open: anyone.
mode = "invite"                          # env SIGNUP_MODE; closed | invite | code | domain | open
# Email domains admitted by signup.mode = "domain", e.g. ["fsu.edu"]. A
# subdomain of a listed domain counts.
allowed_domains = []                     # env SIGNUP_ALLOWED_DOMAINS
# Mail a code that must be answered before an account can create a lab or
# department or invite people. Needs an [email] provider. Off: accounts are
# active as soon as they exist.
verify_email = false                     # env SIGNUP_VERIFY_EMAIL
# Refuse sign-up from an address that matches no known institution (invited
# addresses are exempt).
require_institution_email = false        # env SIGNUP_REQUIRE_INSTITUTION_EMAIL

# How mail leaves the instance. Keys and passwords stay in .env.
[email]
# none: mail is printed to the backend log, never sent. resend: the Resend API
# (RESEND_API_KEY in .env). smtp: any SMTP server (EMAIL_HOST_PASSWORD in
# .env).
provider = "none"                        # env EMAIL_PROVIDER; none | resend | smtp
# The From address. Its domain must be verified with your provider.
from = "Mycelium <mycelium@localhost>"   # env DEFAULT_FROM_EMAIL
# Optional Reply-To. Blank means replies go to the From address.
reply_to = ""                            # env EMAIL_REPLY_TO
# SMTP server host.
smtp_host = ""                           # env EMAIL_HOST
# SMTP server port.
smtp_port = 587                          # env EMAIL_PORT
# SMTP user name.
smtp_user = ""                           # env EMAIL_HOST_USER
# Use STARTTLS for SMTP.
smtp_tls = true                          # env EMAIL_USE_TLS

# Optional features, all off unless switched on.
[features]
# Mylo listens in consenting Discord/Slack channels to keep profiles current.
ambient = false                          # env AMBIENT_ENABLED
# Nightly reasoning over what was heard (needs features.ambient).
ambient_deliberate = false               # env AMBIENT_DELIBERATE_ENABLED
# Let confirmed explorations join a person's paper search.
ambient_drift = false                    # env AMBIENT_DRIFT_ENABLED
# Accept uploaded meeting transcripts as evidence.
ambient_transcripts = false              # env AMBIENT_TRANSCRIPTS_ENABLED
# Outward collaborator search across consenting people.
collab_search = false                    # env COLLAB_SEARCH_ENABLED
# Alerts when a finding bears on a project.
project_alerts = false                   # env PROJECT_ALERTS_ENABLED
# Discord threads for newly fitting grants, fellowships, conferences.
announcements = false                    # env OPPORTUNITY_ANNOUNCEMENTS_ENABLED
# Out-of-band messages for exceptionally strong matches.
high_signal = false                      # env HIGH_SIGNAL_DELIVERY_ENABLED
# Rerank each slate's head with a second model.
rerank = false                           # env RERANK_ENABLED
# The Slack integration.
slack = false                            # env SLACK_ENABLED
# The Microsoft Teams integration.
teams = false                            # env TEAMS_ENABLED

# The language model. The endpoint and model name live in .env (LLM_BASE_URL,
# LLM_MODEL); this section holds policy.
[llm]
# Most tokens one model reply may use, thinking included. 0 sends no cap, so a
# reasoning model is never starved before it answers; set a number only if
# your endpoint needs one.
max_tokens = 0                           # env LLM_MAX_TOKENS

# The decision model that re-orders the head of each theme's slate: TypeSafe's
# hosted Jev, a model you serve on a port, or none.
[decision]
# Which decision model re-orders the top of each theme's slate. jev:
# TypeSafe's hosted model (TYPESAFE_API_KEY in .env; sends profile and item
# text off this host). port: a model you serve yourself at port_url
# (llama.cpp, vLLM or a decide server). off: no decision model, the plain
# ranking stands. auto: jev with a key, else port with a URL, else off.
backend = "auto"                         # env DECISION_BACKEND; auto | jev | port | off
# Where the self-hosted decision model answers, e.g. "http://127.0.0.1:8080"
# (a trailing /v1 is fine). A key, if the server wants one, goes in .env as
# DECISION_PORT_API_KEY.
port_url = ""                            # env DECISION_PORT_URL
# decide: a decision server's POST /v1/decide. openai: an OpenAI-compatible
# chat server read through logprobs (llama.cpp's llama-server, vLLM). auto:
# detected from GET /v1/models.
port_protocol = "auto"                   # env DECISION_PORT_PROTOCOL; auto | decide | openai
# The model to ask on that server. Blank: the server's default (decide) or the
# first one it lists (openai).
port_model = ""                          # env DECISION_PORT_MODEL
# Seconds to wait for one decision from the port.
port_timeout = 30                        # env DECISION_PORT_TIMEOUT
# Reach a decision server that listens only on this host's 127.0.0.1 (such as
# GAIFA's decide): the decision-relay service forwards port_url's port on the
# Docker bridge to the same port on the host's loopback. Needs port_url at
# host.docker.internal.
port_relay = false                       # env DECISION_PORT_RELAY

# The modular tools under tools/. These keys govern all of them; each
# installed tool also reads its own [tools.<name>] section below.
[tools]
# Stop startup when any tool fails to load, instead of setting the broken tool
# (and whatever depends on it) aside. Tests and CI turn this on.
strict = false                           # env MYCELIUM_TOOLS_STRICT
# Tools to keep switched off without deleting their folders, e.g.
# ["screening"]. A core tool cannot be disabled.
disabled = []                            # env MYCELIUM_TOOLS_DISABLED

# Cost controls for the nightly run: how many model calls and how much
# parallelism it may use.
[nightly]
# Most language-model calls one nightly run may make. Past it the run keeps
# ranking without model write-ups.
model_calls = "unlimited"                # suggested: 5000; env NIGHTLY_MODEL_CALLS
# Opportunity-scoring calls in flight at once.
llm_concurrency = 32                     # env OPPORTUNITY_LLM_CONCURRENCY
# Paper and opportunity write-up calls in flight at once.
writeup_concurrency = 32                 # env WRITEUP_LLM_CONCURRENCY
# Rerank calls in flight at once.
rerank_concurrency = 12                  # env TYPESAFE_RERANK_CONCURRENCY
# Write-ups per theme per target per night.
cluster_writeup_budget = 40              # env CLUSTER_WRITEUP_BUDGET
# Model-written 'who is this for' lines per lab feed.
member_fit_llm_limit = 10                # env MEMBER_FIT_LLM_LIMIT
# People's own papers read into the knowledge graph per night.
knowledge_work_facets = 200              # env KNOWLEDGE_WORK_FACETS_NIGHTLY_CAP
# OpenAlex field lookups per night.
knowledge_field_lookups = 200            # env KNOWLEDGE_FIELD_LOOKUPS_NIGHTLY_CAP
# Funding calls read for team requirements per night.
collab_slots = 200                       # env COLLAB_SLOTS_NIGHTLY_CAP
# Conversations read per lab per day.
ambient_extract_per_lab = 200            # env AMBIENT_EXTRACT_DAILY_CAP_PER_LAB
# Conversation reads in flight at once.
ambient_extract_concurrency = 8          # env AMBIENT_EXTRACT_CONCURRENCY
# Profile-change explanations written per night.
ambient_explain = 200                    # env AMBIENT_EXPLAIN_NIGHTLY_CAP

# agent: Mylo as a conversational agent: answers questions about everything a
# person may see in Mycelium (their profile, labs, projects, feeds, the
# corpus, the knowledge graph, stored papers and files), cites what it read,
# remembers, and changes nothing.
[tools.agent]
enabled = true
# model = ""                             # env AGENT_MODEL
# max_output_tokens = 0                  # env AGENT_MAX_OUTPUT_TOKENS
# context_window = 32768                 # env AGENT_CONTEXT_WINDOW
# max_steps = 25                         # env AGENT_MAX_STEPS
# result_cap_tokens = 4000               # env AGENT_RESULT_CAP_TOKENS
# daily_turns = 0                        # env AGENT_DAILY_TURNS
# learning = true                        # env AGENT_LEARNING
# learning_idle_minutes = 30             # env AGENT_LEARNING_IDLE_MINUTES
# retention_days = 0                     # env AGENT_RETENTION_DAYS
# groups_off = []                        # env AGENT_GROUPS_OFF
# surface_groups_off = ["discord_channel:files"] # env AGENT_SURFACE_GROUPS_OFF
# max_risk = "read"                      # env AGENT_MAX_RISK
# redis_db = 8                           # env AGENT_REDIS_DB
# parallel_calls = true                  # env AGENT_PARALLEL_CALLS

# delivery: Puts what was ranked in front of people: the feeds' API, saves and
# collections, project shares, the daily and weekly reports, reminders,
# notifications, project alerts, Discord and Slack delivery, and opportunity
# announcements.
[tools.delivery]
enabled = true
# briefing_retention_days = 90           # env BRIEFING_RETENTION_DAYS
# opportunity_feed_max = 250             # env OPPORTUNITY_FEED_MAX
# fanout_cosine_floor = 0.35             # env FANOUT_COSINE_FLOOR
# fanout_async = false                   # env FANOUT_ASYNC
# high_signal_floor = 90                 # env HIGH_SIGNAL_FLOOR
# high_signal_weekly_cap = 2             # env HIGH_SIGNAL_WEEKLY_CAP
# high_signal_deadline_min_days = 7      # env HIGH_SIGNAL_DEADLINE_MIN_DAYS
# high_signal_deadline_max_days = 120    # env HIGH_SIGNAL_DEADLINE_MAX_DAYS
# project_alert_overlap_threshold = 0.62 # env PROJECT_ALERT_OVERLAP_THRESHOLD
# project_alert_blocker_threshold = 0.58 # env PROJECT_ALERT_BLOCKER_THRESHOLD
# project_alert_slot_threshold = 0.55    # env PROJECT_ALERT_SLOT_THRESHOLD
# project_alert_daily_cap = 3            # env PROJECT_ALERT_DAILY_CAP
# run_analytics_retention_days = 90      # env RUN_ANALYTICS_RETENTION_DAYS

# files: Stores files people upload to themselves, a lab, a department or a
# project, in structured folders under data/files/, extracts their text, and
# lets Mylo read them. Uploads are not virus-scanned.
[tools.files]
enabled = true
# max_bytes = 26214400                   # env FILES_MAX_BYTES
# types = ["pdf", "txt", "md", "csv", "docx"] # env FILES_TYPES
# max_total_mb = 0                       # env FILES_MAX_TOTAL_MB
# max_pages = 0                          # env FILES_MAX_PAGES
# purge_after_days = 0                   # env FILES_PURGE_AFTER_DAYS
# data_dir = ""                          # env FILES_DATA_DIR

# fulltext: Gets the paper itself: checks whether a legal copy of a paper can
# be reached, fetches it from PubMed Central, Europe PMC, arXiv, the
# open-access locators or (with the instance's keys) Elsevier, Springer Nature
# and Wiley, and keeps the original plus a markdown rendering.
[tools.fulltext]
enabled = true
# sources = ["pmc", "europepmc", "elsevier", "springer", "wiley", "arxiv", "unpaywall", "openalex", "crossref", "core", "semanticscholar"] # env FULLTEXT_SOURCES
# contact_email = ""                     # env FULLTEXT_CONTACT_EMAIL
# min_chars = 500                        # env FULLTEXT_MIN_CHARS
# concurrency = 4                        # env FULLTEXT_CONCURRENCY
# disable_ttl_hours = 6.0                # env FULLTEXT_DISABLE_TTL_HOURS
# data_dir = ""                          # env FULLTEXT_DATA_DIR
# redis_url = ""                         # env FULLTEXT_REDIS_URL
# elsevier_api_key: secret, set $ELSEVIER_API_KEY in .env
# elsevier_inst_token: secret, set $ELSEVIER_INST_TOKEN in .env
# springer_api_key: secret, set $SPRINGER_API_KEY in .env
# wiley_tdm_token: secret, set $WILEY_TDM_TOKEN in .env
# core_api_key: secret, set $CORE_API_KEY in .env

# recommendation: Ranks the whole corpus for every person, lab, department and
# project against their profiles and interest clusters, takes each target's
# per-theme slate, and writes the model verdicts.
[tools.recommendation]
enabled = true
# area_focus_weight = 0.25               # env AREA_FOCUS_WEIGHT
# paper_match_threshold = 0.5            # env PAPER_MATCH_THRESHOLD
# paper_match_max_surface = 250          # env PAPER_MATCH_MAX_SURFACE
# paper_min_match_percent = 60           # env PAPER_MIN_MATCH_PERCENT
# report_top_n = 25                      # env REPORT_TOP_N
# paper_cluster_top_n = 0                # env PAPER_CLUSTER_TOP_N
# cluster_admit_frac = 0.5               # env CLUSTER_ADMIT_FRAC
# cluster_admit_hard_floor = 0.35        # env CLUSTER_ADMIT_HARD_FLOOR
# cluster_fit_batch = 12                 # env CLUSTER_FIT_BATCH
# paper_onboarding_min_high_quality = 30 # env PAPER_ONBOARDING_MIN_HIGH_QUALITY
# grant_match_threshold = 0.4            # env GRANT_MATCH_THRESHOLD
# conference_match_threshold = 0.4       # env CONFERENCE_MATCH_THRESHOLD
# fellowship_fit_threshold = 0.0         # env FELLOWSHIP_FIT_THRESHOLD
# fellowship_match_threshold = 0.4       # env FELLOWSHIP_MATCH_THRESHOLD
# fellowship_withhold_unverified = false # env FELLOWSHIP_WITHHOLD_UNVERIFIED
# opportunity_match_max_surface = 250    # env OPPORTUNITY_MATCH_MAX_SURFACE
# opportunity_min_match_percent = 60     # env OPPORTUNITY_MIN_MATCH_PERCENT
# member_fit_cosine_floor = 0.35         # env MEMBER_FIT_COSINE_FLOOR
# member_fit_max_members = 3             # env MEMBER_FIT_MAX_MEMBERS
# project_profile_focus_weight = 1.0     # env PROJECT_PROFILE_FOCUS_WEIGHT
# project_profile_member_weight = 0.6    # env PROJECT_PROFILE_MEMBER_WEIGHT
# project_profile_engagement_weight = 0.4 # env PROJECT_PROFILE_ENGAGEMENT_WEIGHT
# project_profile_halflife_days = 90.0   # env PROJECT_PROFILE_HALFLIFE_DAYS
# team_profile_hour = 3                  # env CELERY_TEAM_PROFILE_HOUR

# retrieval: The grounded corpus: paper sources, the grant, conference and
# fellowship collectors, deduplication, embeddings, deadlines, and search over
