# The union-pool arm with a 5x deeper retrieval pool. Exists because the default
# pool_per_interest = 100 leaves the fused list only 59-97 candidates deep after
# the 0.15 interest floor, which makes any rerank-depth sweep above 100 vacuous.
arm = "fusion_union_pool"

[corpus]
scope = "pooled"
pool_depth = 1000

[embedding]
parallel = 16
batch_size = 64
[params]
pool_per_interest = 500
