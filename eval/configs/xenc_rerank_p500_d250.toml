# Cross-encoder rerank over the DEEP union-pool base, depth 250. This is the real
# rerank-depth curve; the shallow-base sweep could not test it.
arm = "xenc_rerank"

[corpus]
scope = "pooled"
pool_depth = 1000

[embedding]
parallel = 16
batch_size = 64
[params]
pool_per_interest = 500
base = "fusion_union_pool"
rerank_depth = 250
xenc_model = "Xenova/ms-marco-MiniLM-L-6-v2"
