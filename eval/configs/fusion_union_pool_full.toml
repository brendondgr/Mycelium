# The true-hybrid arm. Identical fusion, but the pool is BM25 top-N UNION dense
# top-N, so the lexical channel can *add* a document rather than only reorder.
# The gap against fusion_dense_pool is what the pool restriction costs.
arm = "fusion_union_pool"

[corpus]
scope = "full"

[embedding]
parallel = 16
batch_size = 64

[params]
pool_per_interest = 100
