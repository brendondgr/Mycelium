# Lint settings for tools/: the backend's, so a tool is held to the same
# standard as the platform. Paths in per-file-ignores are relative to tools/.
extend = "../web/backend/pyproject.toml"

[lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
# The open-source opportunity collector and its ported test suite are vendored
# from an external standalone project rather than authored for Mycelium's line
# length; only E501 is forgiven (see web/backend/pyproject.toml).
"retrieval/collect/**" = ["E501"]
"retrieval/tests/collect/**" = ["E501"]
# Host-side scripts moved in from ops/ (which the lint run never covered).
"retrieval/host/**" = ["E501"]
