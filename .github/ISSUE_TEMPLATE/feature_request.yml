name: Feature request
description: Suggest something Mycelium should do for your lab or department.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you or your lab trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Who would use it (a person, a lab, a department), and how often.
