# Enforces the research record. Convention without enforcement decays, and the
# thing that decays first is the index nobody regenerates.
#
# Scoped deliberately to `docs/research/`, `scripts/research/`, and `eval/`: this
# is the repository's first CI job, and it must not become the gate that fails
# for reasons unrelated to what it checks.
name: research record

on:
  pull_request:
    paths:
      - "docs/research/**"
      - "scripts/research/**"
      - "eval/**"
      - "Makefile"
      - ".github/workflows/research-record.yml"
  push:
    branches: [main]
    paths:
      - "docs/research/**"
      - "scripts/research/**"
      - "eval/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync research tooling
        run: uv sync --project scripts/research

      # Regenerate first, then check for a diff: a validator that only reads the
      # committed index cannot tell "current" from "nobody ran it".
      - name: Regenerate index and figures
        run: make research-index figures

      - name: Validate the record
        run: make validate-research

      - name: Fail if the record is stale
        run: |
          if ! git diff --quiet -- docs/research; then
            echo "::error::docs/research/ is stale. Run 'make research-index figures' and commit."
            git --no-pager diff --stat -- docs/research
            git --no-pager diff -- docs/research | head -200
            exit 1
          fi
          echo "Research record is current."
