# Mycelium's production stack. `make setup` and `make up` run this file alone;
# `make dev` adds compose.dev.yaml on top for the hot-reload servers.
#
# Only nginx is published to the network, on ${BIND_ADDR:-127.0.0.1}. Docker's
# published ports go around ufw and firewalld, so binding to loopback is the
# real control: to serve other machines, put TLS in front of this nginx (see
# docs/configuration.md) or set BIND_ADDR. Postgres and both Redis instances
# are published on 127.0.0.1 only, for the Mylo bot that runs on the host.
#
# Every password comes from .env (written by `make setup`); none is written
# here. A missing one stops `docker compose` with the variable's name.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The account the services run as: the owner of this checkout, so nothing they
# write into data/ or the repository ends up owned by root. `make setup` writes
# UID and GID into .env; ops/mycelium also passes them.
x-user: &as-user "${UID:-1000}:${GID:-1000}"

# What every Python service shares: the same venv (under data/, written by
# backend-deps), the same model cache, and a writable HOME that is not the
# read-only repository.
x-python-env: &python-env
  HOME: /tmp
  PYTHONDONTWRITEBYTECODE: "1"
  UV_PROJECT_ENVIRONMENT: /app/data/venv/backend
  UV_CACHE_DIR: /app/data/cache/uv
  UV_LINK_MODE: copy
  # Persist the FastEmbed/ONNX models (and anything Hugging Face downloads) on
  # the bind-mounted disk instead of the container's ephemeral /tmp, so they
  # download once and survive restarts and recreates.
  FASTEMBED_CACHE_PATH: /app/data/models/fastembed
  HF_HOME: /app/data/models/huggingface
  MPLCONFIGDIR: /tmp/matplotlib
  DATABASE_URL: postgres://mycelium:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Run make setup, or see docs/configuration.md}@postgres:5432/mycelium
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is not set. Run make setup, or see docs/configuration.md}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
  # The ambient raw-message buffer: its own Redis, never written to disk.
  AMBIENT_CACHE_URL: redis://:${REDIS_PASSWORD}@redis-ambient:6379/0
  DJANGO_STATIC_ROOT: /app/data/static
  NGINX_PORT: ${NGINX_PORT:-11050}
  # The external hostname this stack is reachable at (a TLS proxy, a Cloudflare
  # tunnel). Django adds it to ALLOWED_HOSTS and the trusted origins, turns on
  # secure cookies and HSTS, and builds every absolute link from it. Assumed
  # HTTPS, since that is what a tunnel or public proxy terminates.
  PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
  # `.env.example` is an env_file for these services, so its DISCORD_* URL
  # defaults are re-declared here — env_file values would otherwise pin them.
  DISCORD_APP_BASE_URL: ${DISCORD_APP_BASE_URL:-}
  DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI:-}
  DISCORD_GUILD_REDIRECT_URI: ${DISCORD_GUILD_REDIRECT_URI:-}
  DISCORD_PORTAL_RETURN_URL: ${DISCORD_PORTAL_RETURN_URL:-}

# The repository read-only; only the runtime state is writable.
x-python-volumes: &python-volumes
  - .:/app:ro
  - ./data:/app/data
  - ./web/backend/media:/app/web/backend/media

# `.env.example` ships the defaults; your `.env` overrides them (later files
# win), so LLM_* and any other overrides in `.env` reach the container.
x-env-files: &env-files
  - .env.example
  - path: .env
    required: false

x-node-env: &node-env
  HOME: /tmp
  npm_config_cache: /tmp/.npm
  NEXT_TELEMETRY_DISABLED: "1"
  ASTRO_TELEMETRY_DISABLED: "1"

services:
  nginx:
    image: nginx:1.29-alpine
    logging: *logging
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${NGINX_PORT:-11050}:80"
    volumes:
      - ./web/infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Production: the public site is the static `astro build` output.
      # compose.dev.yaml swaps this for a proxy to the Astro dev server.
      - ./web/infra/nginx/landing-static.conf:/etc/nginx/mycelium/landing.conf:ro
      - landing-dist:/srv/landing:ro
      # Django admin's CSS and JS (`collectstatic`, run by the backend).
      - ./data/static:/srv/static:ro
    depends_on:
      landing:
        condition: service_completed_successfully
      web:
        condition: service_started
      backend:
        condition: service_started

  # Named volumes start out owned by root. Hand them to the stack's user once,
  # so the Node services (which run as that user) can write to them.
  volume-init:
    image: alpine:3.22
    logging: *logging
    environment:
      OWNER: "${UID:-1000}:${GID:-1000}"
    command:
      - sh
      - -c
      - |
        for dir in /v/node_modules /v/landing-dist; do
          [ "$$(stat -c %u:%g "$$dir")" = "$$OWNER" ] || chown -R "$$OWNER" "$$dir"
        done
    volumes:
      - web-node-modules:/v/node_modules
      - landing-dist:/v/landing-dist

  # One-shot install so landing and web never race on the shared
  # web-node-modules volume (concurrent installs corrupt the workspace
  # symlinks with EEXIST). `npm ci` installs exactly the lockfile; it starts
  # from an empty node_modules, so it runs only when the lockfile changed.
  web-deps:
    image: node:24-alpine
    logging: *logging
    user: *as-user
    working_dir: /app/web
    command:
      - sh
      - -c
      - |
        set -e
        lock="$$(sha256sum package-lock.json | cut -d' ' -f1)"
        if [ "$$(cat node_modules/.mycelium-lock 2>/dev/null)" != "$$lock" ]; then
          npm ci --no-audit --no-fund
          echo "$$lock" > node_modules/.mycelium-lock
        fi
        npm run sync:assets
    environment: *node-env
    volumes:
      - .:/app
      - web-node-modules:/app/web/node_modules
    depends_on:
      volume-init:
        condition: service_completed_successfully

  # Production: build the public site once into the landing-dist volume, which
  # nginx serves as static files. compose.dev.yaml turns this into the Astro
  # dev server instead.
  landing:
    image: node:24-alpine
    logging: *logging
    user: *as-user
    working_dir: /app/web
    # Astro moves its build output with a rename, which cannot cross from the
    # checkout's filesystem into a volume, so build into the (gitignored)
    # web/landing/dist as the stack's own user, then copy into the volume
    # nginx serves.
    command: >-
      sh -c "npm run build:landing &&
      find /srv/landing-dist -mindepth 1 -delete &&
      cp -R landing/dist/. /srv/landing-dist/"
    environment:
      <<: *node-env
      # PUBLIC_APP_URL is deliberately unset: landing and app share the nginx
      # origin, so the site's app links stay relative.
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
    volumes:
      - .:/app
      - web-node-modules:/app/web/node_modules
      - landing-dist:/srv/landing-dist
    depends_on:
      web-deps:
        condition: service_completed_successfully

  # Production: `next build`, then `next start` on :3000. compose.dev.yaml
  # runs `next dev` instead.
  web:
    image: node:24-alpine
    logging: *logging
    user: *as-user
    restart: on-failure
    working_dir: /app/web
    command: sh -c "npm run build:app && exec npm run start:app"
    volumes:
      - .:/app
      - web-node-modules:/app/web/node_modules
    environment:
      <<: *node-env
      NEXT_PUBLIC_API_BASE_URL: /api
      # Browser traffic uses the same-origin /api proxy; these point the
      # Next.js rewrite proxy and SSR fetches at the backend over the compose
      # network (service name + internal port, not a host-published port).
      # The rewrite is fixed at build time, which is why the build runs here.
      API_PROXY_TARGET: http://backend:8000
      API_INTERNAL_URL: http://backend:8000/api
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
    depends_on:
      web-deps:
        condition: service_completed_successfully

  # One-shot dependency sync so backend, worker and beat never race on the
  # shared venv (data/venv/backend). `--locked` installs exactly uv.lock.
  backend-deps:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    logging: *logging
    user: *as-user
    working_dir: /app
    # `--extra scrapers` pulls in `scholarly` so Google Scholar import works.
    # `--extra embeddings` pulls in fastembed + numpy so the literature scan and
    # the daily suggestion pipeline can embed papers and profiles.
    command: sh -c "uv sync --locked --project web/backend --extra scrapers --extra embeddings"
    environment: *python-env
    volumes: *python-volumes

  backend:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    logging: *logging
    user: *as-user
    working_dir: /app
    # Apply migrations before serving so a newly-committed migration is never
    # left unapplied (an unapplied migration shows up as a 500 "relation ...
    # does not exist" the first time the new table or column is touched).
    # Production serves with gunicorn; compose.dev.yaml uses runserver.
    command:
      - sh
      - -c
      - >-
        uv run --no-sync --project web/backend python web/backend/manage.py migrate --noinput &&
        uv run --no-sync --project web/backend python web/backend/manage.py collectstatic --noinput --verbosity 0 &&
        exec uv run --no-sync --project web/backend gunicorn --chdir web/backend config.wsgi:application
        --bind 0.0.0.0:8000 --workers $${GUNICORN_WORKERS:-3} --timeout 300
    restart: on-failure
    volumes: *python-volumes
    env_file: *env-files
    # Let the container reach services bound to the host (e.g. a vLLM server on
    # localhost): set LLM_BASE_URL to http://host.docker.internal:<port>/v1.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *python-env
      # `backend` is the Next proxy's Host header; localhost is the operator's
      # own health checks through nginx. PUBLIC_HOSTNAME is added by Django.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,${DJANGO_ALLOWED_HOSTS:-localhost}
    depends_on:
      backend-deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-ambient:
        condition: service_healthy

  worker:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    logging: *logging
    user: *as-user
    working_dir: /app
    command: sh -c "exec uv run --no-sync --directory web/backend celery -A config worker --loglevel=info"
    restart: on-failure
    volumes: *python-volumes
    env_file: *env-files
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *python-env
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,${DJANGO_ALLOWED_HOSTS:-localhost}
    depends_on:
      backend-deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-ambient:
        condition: service_healthy

  # Celery Beat: enqueues the scheduled jobs onto the worker. Its schedule
  # lives in config.settings (CELERY_BEAT_SCHEDULE).
  beat:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    logging: *logging
    user: *as-user
    working_dir: /app
    # The schedule lives in memory (config/beat.py): Celery's default keeps it
    # in an SQLite shelve file, the leading suspect for two stalls, and it
    # bought nothing once every start began from an empty file anyway. Losing
    # the state only means interval tasks fire once at start. The heartbeat
    # file is removed first: /tmp survives a container restart, and a restarted
    # Beat judged by the dead one's stale file was killed again within seconds
    # (Docker runs the check every 5 s during start_period), which kept Beat
    # down for five hours on 2026-11-14.
    command: sh -c "rm -f /tmp/celerybeat-schedule* /tmp/beat-heartbeat; exec uv run --no-sync --directory web/backend celery -A config beat --loglevel=info --scheduler config.beat:HeartbeatScheduler"
    restart: on-failure
    volumes: *python-volumes
    env_file: *env-files
    environment:
      <<: *python-env
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,${DJANGO_ALLOWED_HOSTS:-localhost}
    depends_on:
      backend-deps:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redis-ambient:
        condition: service_healthy
    # Liveness, not readiness. On 2026-08-04 Beat stopped scheduling for 2.5 hours
    # while its process stayed alive and asleep, so `restart: on-failure` never fired
    # and Docker still reported the container Up. Nothing was delivered — the daily
    # run only *enqueues* into the Discord outbox, and `drain-discord-outbox` (every
    # minute, here) is what actually sends — yet the run reported success, because
    # every stage had in fact succeeded. A wedged-but-alive Beat is invisible unless
    # something checks that it is still doing work.
    #
    # The signal is the mtime of /tmp/beat-heartbeat, which the scheduler touches
    # on every tick (every minute here, with the outbox drains). Until 2026-11-14
    # it was the mtime of the schedule state file, which no longer exists.
    #
    # A Compose healthcheck only *marks* a container unhealthy; it restarts nothing.
    # So on a stale read this kills the Beat process to make the container exit
    # non-zero, which is what `restart: on-failure` above already knows how to
    # recover. Note SIGKILL to PID 1 is ignored from inside its own PID namespace,
    # so the pattern targets the celery process rather than the `sh -c` wrapper
    # (the `exec` above makes celery PID 1 only after uv hands off; pkill -f still
    # matches it).
    #
    # The threshold is deliberately several times the sync cadence: a false positive
    # here restarts a healthy Beat on a loop, which is worse than a late recovery.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          newest=$$(stat -c %Y /tmp/beat-heartbeat 2>/dev/null);
          [ -z "$$newest" ] && exit 0;
          age=$$(( $$(date +%s) - $$newest ));
          [ "$$age" -lt ${BEAT_STALE_SECONDS:-900} ] && exit 0;
          echo "beat: no tick for $${age}s — killing it so restart:on-failure recovers it";
          pkill -9 -f '[c]elery -A config beat';
          exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      # Beat first ticks only after the interpreter and Django are up; until
      # then there is no heartbeat (the command removes any old one) and the
      # check exits 0 anyway.
      start_period: 120s

  # Optional SSH tunnel to a remote LLM server, run *inside* the compose network.
  #
  # A tunnel on the host does not work: the backend runs in a container, so it
  # reaches the host only via the docker gateway, and (a) `ssh -L 127.0.0.1:...`
  # binds loopback only, (b) a host firewall with a default-DROP input policy
  # (ufw's default) silently drops container -> host packets. Both failures look
  # identical from the app — the LLM call hangs until it times out and every
  # LLM-backed feature quietly drops to its deterministic fallback.
  #
  # Running the forward in a service sidesteps both: the port is reachable on
  # the compose network, where the backend already talks to postgres and redis.
  # Set LLM_TUNNEL_HOST in `.env` to an ssh host alias from your ssh config and
  # point LLM_BASE_URL at http://llm-tunnel:9090/v1. Unset, the service idles.
  # It runs as root because it installs the ssh client at start.
  llm-tunnel:
    image: alpine:3.22
    logging: *logging
    restart: unless-stopped
    environment:
      # An ssh host alias (resolved from the mounted ssh config), not a hostname:
      # ProxyJump, IdentityFile, and key-algorithm options come from there.
      LLM_TUNNEL_HOST: ${LLM_TUNNEL_HOST:-}
      # Listen port inside this container = the port the backend connects to.
      LLM_TUNNEL_PORT: ${LLM_TUNNEL_PORT:-9090}
      # Port the model server listens on, on the far side of the ssh hop.
      LLM_TUNNEL_REMOTE_PORT: ${LLM_TUNNEL_REMOTE_PORT:-9090}
    volumes:
      # Your ssh directory (config + keys + known_hosts), read-only: they are
      # copied to a root-owned /root/.ssh at start, because ssh refuses a private
      # key owned by another uid. The default is an empty directory under data/,
      # so nothing of the host's is mounted while the tunnel is off. Set
      # LLM_TUNNEL_SSH_DIR in `.env` to an absolute path (e.g. /home/you/.ssh).
      - ${LLM_TUNNEL_SSH_DIR:-./data/empty}:/ssh-src:ro
    command:
      - sh
      - -c
      - |
        set -e
        if [ -z "$$LLM_TUNNEL_HOST" ]; then
          echo "llm-tunnel: LLM_TUNNEL_HOST unset — tunnel disabled; idling."
          exec sleep infinity
        fi
        if [ ! -r /ssh-src/config ]; then
          echo "llm-tunnel: no ssh config at /ssh-src — set LLM_TUNNEL_SSH_DIR to your ssh directory; idling."
          exec sleep infinity
        fi
        apk add --no-cache openssh-client >/dev/null
        mkdir -p /root/.ssh
        cp -r /ssh-src/. /root/.ssh/
        chmod 700 /root/.ssh
        find /root/.ssh -type f -exec chmod 600 {} +
        echo "llm-tunnel: forwarding :$$LLM_TUNNEL_PORT -> $$LLM_TUNNEL_HOST:$$LLM_TUNNEL_REMOTE_PORT"
        exec ssh -N -T \
          -o BatchMode=yes \
          -o ExitOnForwardFailure=yes \
          -o ForwardX11=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=3 \
          -L "0.0.0.0:$$LLM_TUNNEL_PORT:127.0.0.1:$$LLM_TUNNEL_REMOTE_PORT" \
          "$$LLM_TUNNEL_HOST"

  # Optional relay to a decision or model server that listens only on this
  # host's 127.0.0.1 (GAIFA's decide, say), which the backend container cannot
  # reach. With `[decision] port_relay = true` and `port_url =
  # "http://host.docker.internal:<port>"` in mycelium.toml, this service (on the
  # host network) listens on the Docker bridge address that host.docker.internal
  # names, on that port, and pipes each connection to 127.0.0.1:<port>. Off (the
  # default), it idles and listens on nothing.
  #
  # While on, the forwarded port is reachable by every container on this host,
  # not only Mycelium's: the relay adds no authentication of its own. Turn it on
  # only for a server that needs no protection from other local containers, or
  # give that server its own token. See docs/configuration.md.
  # Code: web/backend/apps/core/decision_relay.py (standard library only).
  decision-relay:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    logging: *logging
    user: *as-user
    working_dir: /app/web/backend
    network_mode: host
    restart: unless-stopped
    command: ["python", "-u", "-m", "apps.core.decision_relay"]
    volumes:
      - .:/app:ro
    env_file: *env-files
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: pgvector/pgvector:pg17
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: mycelium
      POSTGRES_USER: mycelium
      # Read once, when the volume is first initialised. To change it on an
      # existing database: `ops/mycelium rotate-db-password`.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Run make setup, or see docs/configuration.md}
    ports:
      # Loopback only: the Mylo bot and the daily runner on the host use it.
      - "127.0.0.1:${POSTGRES_PORT:-11450}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycelium -d mycelium"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    logging: *logging
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set. Run make setup, or see docs/configuration.md}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      # Loopback only: the Mylo bot on the host keeps its Discord link state
      # (activation lockouts, OAuth nonces) here.
      - "127.0.0.1:${REDIS_PORT:-11550}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The ambient raw-message buffer (apps.ambient.buffer) — the one store that
  # ever holds a person's actual words. Its own instance so persistence can be
  # off: no RDB snapshot, no AOF, no volume. A restart empties it, which costs
  # at most a few hours of unread conversation and is the promise working.
  redis-ambient:
    image: redis:8-alpine
    logging: *logging
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      # Loopback only: the Mylo bot on the host writes the messages it hears.
      - "127.0.0.1:${AMBIENT_REDIS_PORT:-11551}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Neo4j and MinIO are not used by any code yet. They start only with
  # `docker compose --profile experimental up`, and publish nothing.
  neo4j:
    image: neo4j:5-community
    logging: *logging
    profiles: ["experimental"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-}
    volumes:
      - neo4j-data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    logging: *logging
    profiles: ["experimental"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mycelium
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  neo4j-data:
  minio-data:
  web-node-modules:
  landing-dist:
