services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${NGINX_PORT:-11050}:80"
    volumes:
      - ./web/infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - landing
      - web
      - backend

  # One-shot install so landing and web never race on the shared
  # web-node-modules volume (concurrent npm installs corrupt the workspace
  # symlinks with EEXIST). Both dev servers wait for this to finish.
  web-deps:
    image: node:24-alpine
    working_dir: /app/web
    command: sh -c "npm install && npm run sync:assets"
    volumes:
      - .:/app
      - web-node-modules:/app/web/node_modules

  landing:
    image: node:24-alpine
    working_dir: /app/web
    command: sh -c "npm run dev:landing"
    ports:
      - "${LANDING_PORT:-11150}:4321"
    volumes:
      - .:/app
      - web-node-modules:/app/web/node_modules
    environment:
      # PUBLIC_APP_URL is deliberately unset: landing and app share the nginx
      # origin, so the site's app links stay relative and follow whatever host
      # the visitor used. Set it only if the app moves to its own origin.
      #
      # Vite (Astro's dev server) rejects any Host header it was not started
      # with, so a reverse proxy or Cloudflare tunnel in front of it gets
      # "Blocked request. This host is not allowed." Set PUBLIC_HOSTNAME in
      # .env to the external hostname to allow it through.
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
    depends_on:
      web-deps:
        condition: service_completed_successfully

  web:
    image: node:24-alpine
    working_dir: /app/web
    command: sh -c "npm run dev:app:docker"
    ports:
      - "${WEB_PORT:-11250}:3000"
    volumes:
      - .:/app
      - web-node-modules:/app/web/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      # Browser traffic uses the same-origin /api proxy; these point the
      # Next.js rewrite proxy and SSR fetches at the backend over the compose
      # network (service name + internal port, not a host-published port).
      API_PROXY_TARGET: http://backend:8000
      API_INTERNAL_URL: http://backend:8000/api
      # Next blocks cross-origin requests to dev-only assets/endpoints, so the
      # external hostname must be declared (next.config.ts allowedDevOrigins).
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
    depends_on:
      web-deps:
        condition: service_completed_successfully

  # One-shot dependency sync so backend and worker never race on the shared
  # web/backend/.venv bind mount. Both processes wait for this to finish.
  backend-deps:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    working_dir: /app
    # `--extra scrapers` pulls in `scholarly` so Google Scholar import works.
    # `--extra embeddings` pulls in fastembed + numpy so the literature scan and
    # the daily suggestion pipeline can embed papers and profiles for pgvector
    # retrieval. This shared venv (web/backend/.venv) is used by backend + worker.
    command: sh -c "uv sync --project web/backend --extra scrapers --extra embeddings"
    volumes:
      - .:/app

  backend:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    working_dir: /app
    # Apply migrations before serving so a newly-committed migration is never
    # left unapplied against the running database (an unapplied migration shows
    # up as a 500 "relation ... does not exist" the first time the new table or
    # column is touched).
    command: sh -c "uv run --project web/backend python web/backend/manage.py migrate --noinput && uv run --project web/backend python web/backend/manage.py runserver 0.0.0.0:8000"
    restart: on-failure
    ports:
      - "${BACKEND_PORT:-11350}:8000"
    volumes:
      - .:/app
    # `.env.example` ships safe defaults; a developer's `.env` (optional)
    # overrides them — later files win, so LLM_* and any other overrides in
    # `.env` actually reach the container.
    env_file:
      - .env.example
      - path: .env
        required: false
    # Let the container reach services bound to the host (e.g. a vLLM server on
    # localhost): set LLM_BASE_URL to http://host.docker.internal:<port>/v1.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://mycelium:mycelium@postgres:5432/mycelium
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      NEO4J_URI: bolt://neo4j:7687
      S3_ENDPOINT_URL: http://minio:9000
      # Persist the FastEmbed/ONNX model on the bind-mounted disk (repo `models/`)
      # instead of the container's ephemeral /tmp, so it downloads once and
      # survives restarts/recreates.
      FASTEMBED_CACHE_PATH: /app/models/fastembed
      # PUBLIC_HOSTNAME (set in .env) is the external hostname this stack is
      # reachable at — e.g. a Cloudflare tunnel domain. Without it in
      # ALLOWED_HOSTS Django answers every proxied request with a 400
      # DisallowedHost; without it in the CSRF/CORS origins, logging in and any
      # POST from that origin are rejected. It is assumed to be HTTPS, since
      # that is what a tunnel or public proxy terminates.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,${PUBLIC_HOSTNAME:-localhost}
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:11050,http://localhost:11250,https://${PUBLIC_HOSTNAME:-localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:11050,http://localhost:11250,https://${PUBLIC_HOSTNAME:-localhost}
      # Also hand the hostname to Django itself: every absolute URL it gives a
      # browser (the Discord OAuth callbacks, the portal return, digest links)
      # derives from PUBLIC_BASE_URL, so they follow the public host instead of
      # pointing visitors at localhost. `.env.example` is an env_file for this
      # service, so its DISCORD_* URL defaults are re-declared here — env_file
      # values would otherwise pin them to localhost.
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
      DISCORD_APP_BASE_URL: ${DISCORD_APP_BASE_URL:-}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI:-}
      DISCORD_GUILD_REDIRECT_URI: ${DISCORD_GUILD_REDIRECT_URI:-}
      DISCORD_PORTAL_RETURN_URL: ${DISCORD_PORTAL_RETURN_URL:-}
    depends_on:
      backend-deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started
      minio:
        condition: service_started

  worker:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    working_dir: /app
    # Run celery from web/backend so the `config` package is importable.
    command: sh -c "uv run --directory web/backend celery -A config worker --loglevel=info"
    restart: on-failure
    volumes:
      - .:/app
    # `.env` (optional) overrides the `.env.example` defaults — later files win.
    env_file:
      - .env.example
      - path: .env
        required: false
    # Reach host-bound services (e.g. a vLLM server) via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://mycelium:mycelium@postgres:5432/mycelium
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      NEO4J_URI: bolt://neo4j:7687
      S3_ENDPOINT_URL: http://minio:9000
      # Share the same persistent model cache as the backend (repo `models/`).
      FASTEMBED_CACHE_PATH: /app/models/fastembed
    depends_on:
      backend-deps:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Celery Beat: enqueues the scheduled jobs (the daily research-suggestion run)
  # onto the worker. Its schedule lives in config.settings (CELERY_BEAT_SCHEDULE).
  beat:
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    working_dir: /app
    # Keep the schedule state file off the bind mount (in the container's /tmp).
    command: sh -c "uv run --directory web/backend celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule"
    restart: on-failure
    volumes:
      - .:/app
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://mycelium:mycelium@postgres:5432/mycelium
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      backend-deps:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Optional SSH tunnel to a remote LLM server, run *inside* the compose network.
  #
  # A tunnel on the host does not work: the backend runs in a container, so it
  # reaches the host only via the docker gateway, and (a) `ssh -L 127.0.0.1:...`
  # binds loopback only, (b) a host firewall with a default-DROP input policy
  # (ufw's default) silently drops container -> host packets. Both failures look
  # identical from the app — the LLM call hangs until it times out and every
  # LLM-backed feature quietly drops to its deterministic fallback.
  #
  # Running the forward in a service sidesteps both: the port is published on the
  # compose network, where the backend already talks to postgres and redis. Set
  # LLM_TUNNEL_HOST in `.env` to an ssh host alias from your ssh config and point
  # LLM_BASE_URL at http://llm-tunnel:9090/v1. Unset, the service idles.
  llm-tunnel:
    image: alpine:3.22
    restart: unless-stopped
    environment:
      # An ssh host alias (resolved from the mounted ssh config), not a hostname:
      # ProxyJump, IdentityFile, and key-algorithm options come from there.
      LLM_TUNNEL_HOST: ${LLM_TUNNEL_HOST:-}
      # Listen port inside this container = the port the backend connects to.
      LLM_TUNNEL_PORT: ${LLM_TUNNEL_PORT:-9090}
      # Port the model server listens on, on the far side of the ssh hop.
      LLM_TUNNEL_REMOTE_PORT: ${LLM_TUNNEL_REMOTE_PORT:-9090}
    volumes:
      # Your ssh directory (config + keys + known_hosts), read-only: they are
      # copied to a root-owned /root/.ssh at start, because ssh refuses a private
      # key owned by another uid. The default is an inert placeholder that only
      # ever gets mounted while the tunnel is disabled — set LLM_TUNNEL_SSH_DIR
      # in `.env` to an absolute path (e.g. /home/you/.ssh) to enable it.
      - ${LLM_TUNNEL_SSH_DIR:-/etc/ssh}:/ssh-src:ro
    command:
      - sh
      - -c
      - |
        set -e
        if [ -z "$$LLM_TUNNEL_HOST" ]; then
          echo "llm-tunnel: LLM_TUNNEL_HOST unset — tunnel disabled; idling."
          exec sleep infinity
        fi
        if [ ! -r /ssh-src/config ]; then
          echo "llm-tunnel: no ssh config at /ssh-src — set LLM_TUNNEL_SSH_DIR to your ssh directory; idling."
          exec sleep infinity
        fi
        apk add --no-cache openssh-client >/dev/null
        mkdir -p /root/.ssh
        cp -r /ssh-src/. /root/.ssh/
        chmod 700 /root/.ssh
        find /root/.ssh -type f -exec chmod 600 {} +
        echo "llm-tunnel: forwarding :$$LLM_TUNNEL_PORT -> $$LLM_TUNNEL_HOST:$$LLM_TUNNEL_REMOTE_PORT"
        exec ssh -N -T \
          -o BatchMode=yes \
          -o ExitOnForwardFailure=yes \
          -o ForwardX11=no \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=3 \
          -L "0.0.0.0:$$LLM_TUNNEL_PORT:127.0.0.1:$$LLM_TUNNEL_REMOTE_PORT" \
          "$$LLM_TUNNEL_HOST"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: mycelium
      POSTGRES_USER: mycelium
      POSTGRES_PASSWORD: mycelium
    ports:
      - "${POSTGRES_PORT:-11450}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycelium -d mycelium"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-11550}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/change-me
    ports:
      - "${NEO4J_HTTP_PORT:-11650}:7474"
      - "${NEO4J_BOLT_PORT:-11750}:7687"
    volumes:
      - neo4j-data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mycelium
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "${MINIO_API_PORT:-11850}:9000"
      - "${MINIO_CONSOLE_PORT:-11950}:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  neo4j-data:
  minio-data:
  web-node-modules:
