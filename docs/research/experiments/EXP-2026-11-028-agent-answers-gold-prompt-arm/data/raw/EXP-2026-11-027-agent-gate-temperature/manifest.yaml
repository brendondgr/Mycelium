id: EXP-2026-11-027
slug: agent-gate-temperature
title: Access test at three temperatures, rules in code against rules in the prompt
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-24
date_completed: 2026-11-24
authors: [Claude Fable 5.2 (agent), on behalf of the maintainer]

purpose: >
  Repeats the access test (EXP-2026-11-016 round two, rules in code against
  rules in the prompt) at temperatures 0, 0.2 and 0.7 on the product code
  frozen at 44100c04. Every earlier Mylo evaluation ran at the instance
  default of 0.2, so the record does not show whether the result depends on
  it. Tests C-058 and C-059.

hypothesis: >
  Rules in code: 0 leaks at every temperature (C-058). Rules in the prompt: a
  leak rate above zero at every temperature, the Newcombe 95% interval of the
  difference excluding zero at each (C-059). Whether the prompt arm's rate or
  the entitled askers' answer rate moves with temperature: exploratory, no
  prior hypothesis.

