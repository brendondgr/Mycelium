id: EXP-2026-11-028
slug: agent-answers-gold-prompt-arm
title: Answer accuracy with the rules in code against the rules in the prompt, on a demo-only sandbox
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-24
date_completed: 2026-11-24
authors: [Claude Fable 5.2 (agent), on behalf of the maintainer]

purpose: >
  Runs EXP-2026-11-018's answer-accuracy questions on Mylo as shipped and on
  Mylo with the permission gate bypassed and the access policy in the system
  prompt, both on a sandbox database that holds only the fictional demo lab
  and the public corpus. Gives the record its first code-against-prompt
  comparison on answer accuracy. Tests C-060.

hypothesis: >
  Over the answerable questions, the paired 95% interval of the difference in
  full credit (code minus prompt) includes zero or lies above it (C-060): the
  asker is allowed nearly everything, so the gate should rarely act. By
  question kind and on the unanswerable questions: exploratory, no prior
  hypothesis.

