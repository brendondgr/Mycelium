id: EXP-2026-11-008
slug: decision-port-throughput
title: How many decisions per second does the local decide port sustain through Mycelium's client?
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-09
date_completed: 2026-11-09

authors: [brendondgr]

purpose: >
  Capacity check for the new [decision] backend = "port" path
  (apps/core/decisions.py). Measures throughput and latency of GAIFA's decide
  server (d3-lite) at 1, 4 and 8 requests in flight, through the
  decision_check management command, with a fixed synthetic state. Planning
  input for the nightly rerank's concurrency setting; no quality claim.

hypothesis: >
  Exploratory, with one stated expectation: the decide mod takes a GAIFA GPU
  queue lease per call, so concurrency should raise latency rather than
  throughput. Falsifier for that expectation: throughput at 8 in flight more
  than 1.5x throughput at 1.
  OUTCOME: expectation held — 7.13 calls/s at 1, 8.56 at 8 (1.20x), p50 latency
  131 ms -> 919 ms. Zero failures in 144 calls.

