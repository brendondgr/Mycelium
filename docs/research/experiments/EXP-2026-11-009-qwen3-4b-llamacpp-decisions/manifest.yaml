id: EXP-2026-11-009
slug: qwen3-4b-llamacpp-decisions
title: Does a stock 4B instruct model on llama.cpp make usable rerank decisions through the port path?
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-09
date_completed: 2026-11-09
authors: [brendondgr]

purpose: >
  First live test of the [decision] backend = "port" path's openai protocol:
  Qwen3-4B (Q4_K_M GGUF) served by llama.cpp llama-server (Vulkan, Radeon
  8060S), asked the production rerank questions via first-token logprobs on
  the same 165 states as EXP-2026-11-007, compared pair for pair with d3-lite,
  plus a throughput sweep. Feasibility of llama.cpp as a local decision host,
  and whether a general instruct model can stand in for a decision model.

hypothesis: >
  Stated prior: Qwen3-4B beats d3-lite on the off-theme control, most on
  grants. Falsifier: the paired AUC-difference interval includes or sits below
  zero, or grant AUC stays under 0.65.
  OUTCOME: refuted. Every answer saturated — worth >= 0.999995 on all 165 pairs
  (on- and off-theme), every fit argmax "read", every venue_fit 1.0 — so worth
  AUC is 0.489 (ties), 0.201 below d3-lite with a 95% paired bootstrap interval
  of [-0.280, -0.129]. The transport works: 0 failures, and llama.cpp serves
  calls in parallel (22.8 calls/s at 4 in flight vs 7.2 at 1).

