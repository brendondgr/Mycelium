id: EXP-2026-11-020
slug: agent-verifier-loop
title: The answer checker as a loop: repair, removal, unread
status: running # planned | running | complete | failed | superseded
date_started: 2026-11-15
date_completed: null
authors: [Claude (agent), Brendon (owner)]

purpose: >
  What Mylo's answer loop does with a draft its checker flags (forced drafts
  with injected errors, real repair), whether the `unread` check fires on a
  reference a thread surfaced but never read (O9), and how often real answers
  carry an unsupported detail as judged by a second model. Tests C-047 to
  C-049; adds a model-judged recall figure to C-035.

hypothesis: >
  C-047: no flagged injected error reaches a final answer. C-048: at least
  half of flagged drafts are repaired rather than stripped. C-049: `unread`
  flags at least 18 of 20 surfaced-but-unread references and none of 20 read
  ones; predicted refuted from the code (a search listing counts as seen).

