id: EXP-2026-09-004
slug: typesafe-pointwise-rerank-longeval
title: Does a calibrated pointwise probability rerank a scholarly feed better than BM25 alone?
status: complete # planned | running | complete | failed | superseded
date_started: 2026-09-17
date_completed: 2026-09-17
authors: [brendondgr]

purpose: >
  The first reranker in this record that is not MS MARCO-trained and not a text
  generator. Every reranker tried on LongEval-Sci has lost or tied against BM25
  (C-013 refuted; C-015 and C-016 against the LLM), and the one explanation the
  record left standing is training-distribution mismatch (Q-021, Q-023). Two
  pointwise arms — a yes/no probability and a four-level rubric Score whose
  level texts are the refuted LLM rubric's — rerank BM25's top 20 on
  sci-2026-train, with paired bootstrap intervals, the C-016 discrimination
  measurements read from the raw answers, cost and latency from the API's usage
  block, and a determinism check before anything is trusted. Bears on C-016,
  C-026, C-027, Q-020, Q-021, Q-023.

hypothesis: >
  Pre-registered in PROTOCOL.md before any arm ran. PRIMARY: typesafe_noul over
  bm25_only beats bm25_only on nDCG@10 with a 95% paired interval excluding
  zero; falsifier: interval spans zero or mean negative. SECONDARY: typesafe_score
  gives more than 5 distinct values per 20-window and a mean monotonic in judged
  grade. TERTIARY: the two arms agree on the top 10 at mean Jaccard >= 0.8.
  DETERMINISM: 20 pairs x 3, max |delta noul| <= 0.01 bar, > 0.05 falsifier.
  OUTCOME: PRIMARY falsified — +0.0185 nDCG@10, CI [-0.0207, +0.0603], 43W/36L/21T,
  sign p 0.5; the delta is positive in every query-length bucket, the opposite
  shape from the cross-encoder's short-query harm, but n = 100 cannot separate
  it from zero. SECONDARY falsified on its monotonicity half: 17.38 distinct
  values (bar 5, LLM rubric 1.99) but grade 1 scores above grade 2 in both arms,
  as it did for the LLM rubric (Q-041). TERTIARY met: Jaccard 0.805. The yes/no
  framing beats the rubric framing significantly (+0.0237, CI excludes zero,
  sign p 0.018). Determinism 0.040, between bar and falsifier. Replication on
  sci-2025-01 did not run, per the rule; recorded as Q-040.

