id: EXP-2026-11-007
slug: d3-lite-local-decision-smoke
title: Can a 0.85B decision model served on this host answer the TypeSafe rerank questions?
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-09
date_completed: 2026-11-09
authors: [brendondgr]

purpose: >
  Feasibility smoke test for replacing the hosted TypeSafe Jev call in
  tools/recommendation/typesafe_rerank.py with a decision model running on this
  host. The local "Decisions" server at 127.0.0.1:5107 serves d3-lite (0.85B,
  vllm-sr/d3-lite) behind POST /v1/decide, which answers yesno / choice / score
  questions with probabilities — the same three shapes as Jev's Noul / Choice /
  Score. One reader's current slates (120 (theme, item) pairs over papers,
  grants and conferences, 5 themes) plus a 45-pair off-theme control were sent
  with the production states and the production questions translated to the
  server's schema. No human judgements; bears on C-016 (pointwise
  discrimination) only as a smoke signal.

hypothesis: >
  Exploratory — no prior hypothesis about agreement. Pre-registered gates in
  PROTOCOL.md: 100% availability and p95 under 1 s per call (viability);
  discrimination AUC of worth on-theme vs off-theme >= 0.75 (falsifier: below);
  exact verdict agreement flagged if under 40%.
  OUTCOME: availability 1.0 and p95 551 ms — viable. Discrimination AUC 0.690,
  BELOW the 0.75 bar (falsifier fired as written), though the paired win rate
  is 0.822; by type papers 0.827, conferences 0.764, grants 0.538. Exact
  verdict agreement 0.233 (flag fired); the fit Score does not discriminate at
  all (AUC 0.459) and correlates negatively with the stored verdict.

