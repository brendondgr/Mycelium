id: EXP-2026-09-019
slug: ambient-drift-weight-ablation
title: "How much may a confirmed exploration weigh before it moves the declared slates?"
status: complete
date_started: 2026-09-19
date_completed: 2026-09-19
authors: [brendondgr]

purpose: >
  Ambient Plan 10 experiment 8, the drift ablation owed before
  AMBIENT_DRIFT_ENABLED is turned on: declared-only against declared plus
  confirmed explorations at four weights, persona-level (the LongEval harness
  has no people and so no explorations; the hook is inert there).

hypothesis: >
  H1 at 0.15 declared-slate Jaccard >= 0.95 and mean displaced from top 25 <= 1;
  H2 monotone in the weight; H3 own papers lead the exploration slate
  (>= 0.75) at every weight; decision rule: the largest weight meeting H1's
  bars is the recommended default. OUTCOME: H1, H2 and H3 hold; declared-slate
  Jaccard is weight-independent (0.98); displacement 0, 0, 0.67, 9.0 at 0.05,
  0.15, 0.30, 1.0; by the rule 0.30; the shipped default stays 0.15.

