id: EXP-2026-11-001
slug: dept-level-precision
title: Precision of the department-level call detector
status: complete
date_started: 2026-11-05
date_completed: 2026-11-05
authors: [brendondgr]

purpose: >
  Before departments get their own announcement channel, measure how often the
  department-level detector (apps/content/dept_level.py) is right when it says a
  call is one only a department can take on (institutional selection, department
  applicant, department-scale programme). Supports C-028.

hypothesis: >
  Exploratory. Stated expectation: the NIH activity-code rule is near-exact and
  the free-text institutional-selection rules misfire on per-PI or per-project
  limits. OUTCOME: both held (codes 25/25 correct; four of eighteen
  institutional-selection firings wrong). v1 0.833 overall; five rules removed;
  v2 1.0 on the same sample (48/48 on re-run), biased by construction.

