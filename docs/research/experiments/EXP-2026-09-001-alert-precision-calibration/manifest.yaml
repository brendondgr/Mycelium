id: EXP-2026-09-001
slug: alert-precision-calibration
title: Alert precision, and the thresholds it sets
status: planned # planned | running | complete | failed | superseded
date_started: 2026-09-11
date_completed: null
authors: [brendondgr]

purpose: >
  Three of the five project-alert triggers rest on a raw-cosine similarity
  against a threshold that nobody measured. PROJECT_ALERTS_ENABLED ships off
  because of it. This asks what threshold each trigger needs to reach a usable
  alert precision, and whether any of the three is good enough to enable at all.
  Supports C-024.

hypothesis: >
  Exploratory on the threshold values — no prior hypothesis about where they
  land. One prior belief is stated so it can be refuted: that overlap_risk will
  clear the bar and team_gap will not, because an overlap is a comparison of two
  specific claims while a required-expertise match is a comparison of two short
  phrases with far less to go on.

