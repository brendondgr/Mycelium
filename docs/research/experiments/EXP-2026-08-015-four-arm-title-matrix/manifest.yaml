id: EXP-2026-08-015
slug: four-arm-title-matrix
title: "Four arms, one query: title-by-arm rank matrix for human preference"
status: complete
date_started: 2026-08-22
date_completed: 2026-08-22
authors: [brendondgr]

purpose: >
  EXP-2026-08-014 failed as an instrument before it succeeded as a question: 42
  pages, ten arms, three queries, and the reader could not tell which arm ranked
  what. This is the same elicitation cut to the four arms and the one query the
  reader named, in a format built for one job -- read a title, see where each arm
  put it. Rows are document titles in full and nothing else, columns are the four
  blinded arms, cells are rank. The fourth arm is fusion_union_splade, the
  three-channel stack this programme has spent four experiments recommending and
  the only arm EXP-2026-08-014 left with no human read.

hypothesis: >
  None, deliberately, on which arm wins: the corpus has no relevance judgments,
  an LLM judge is the component EXP-2026-08-008 measured as non-monotonic in
  relevance, and the author's opinion is not evidence. OUTCOME on the answerable
  half: the four arms -- all of which passed a human read, or were never read --
  still disagree substantially. On papers, 21 distinct documents across the four
  top-tens at a mean pairwise Jaccard@10 of 0.31, so two arms typically share
  three of their ten papers. Conferences agree most (0.59), papers least,
  matching EXP-2026-08-014 on a different query. Cost: the cross-encoder arm
  costs 1.866 s/query end to end against 0.094-0.186 s for the three
  single-stage arms -- 18x the arm it reranks.

