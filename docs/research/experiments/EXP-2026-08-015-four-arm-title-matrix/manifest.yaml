  estimated_cost_usd: null

# --- Results block -----------------------------------------------------------
metrics:
  primary: mean pairwise Jaccard@10 between arms (agreement, not quality)
  values:
    agreement__mean_pairwise_jaccard10__papers: 0.309 # 21 distinct docs across the four top-10s
    agreement__mean_pairwise_jaccard10__grants: 0.489 # 17 distinct
    agreement__mean_pairwise_jaccard10__fellowships: 0.527 # 16 distinct
    agreement__mean_pairwise_jaccard10__conferences: 0.585 # 16 distinct
    latency__fusion_union_pool__seconds_per_query: 0.094
    latency__fusion_dense_pool__seconds_per_query: 0.103 # production as deployed
    latency__fusion_union_splade__seconds_per_query: 0.186 # + a one-time 23 min encode and a second index
    latency__fusion_dense_pool_xenc__seconds_per_query: 1.866 # end to end; 18x the arm it reranks
baselines_compared: [fusion_dense_pool]
statistical_test: null # by design -- this experiment reports composition and cost, and elicits a preference

