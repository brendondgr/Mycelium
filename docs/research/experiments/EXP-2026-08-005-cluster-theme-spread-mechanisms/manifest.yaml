# --- Results block -----------------------------------------------------------
# The primary value is the paired delta in `min_cluster_recall@10` — the
# worst-served theme's recall inside the visible feed — under the `imbalanced`
# grouping, against the deployed `clustered_profile` baseline. `n` is paired
# profiles; `std` is the per-profile standard deviation of the paired delta,
# derived in build_metrics.py, never entered by hand.
#
# Read the `_vs_flat` rows before the others. Four mechanisms beat the *cluster*
# baseline with intervals excluding zero, but not one beats the *flat* baseline:
# every `_vs_flat` interval spans zero. The gains repair damage that clustering
# the ranking caused rather than creating value over not clustering it — which is
# why this refutes C-011 as stated.
#
# `delta_min_cluster_recall@10_imbalanced_floor` is exactly 0.0 with std exactly
# 0.0: pre-registered hypothesis 2 held, and the per-theme admission floor is
# inert at production surfacing.
#
# `identity_drift_max` is the falsifier-4 check: the largest absolute per-profile
# difference between the null spread policy and the untouched baseline, over every
# measure and every grouping. It is 0.0, so the spread code path adds nothing.
metrics:
  primary: delta_min_cluster_recall@10_imbalanced_mmr
  values:
    delta_min_cluster_recall@10_imbalanced_mmr: {mean: 0.004255, std: 0.008656, n: 30}
    delta_min_cluster_recall@10_imbalanced_rankmerge: {mean: 0.004739, std: 0.010998, n: 30}
    delta_min_cluster_recall@10_imbalanced_interleave: {mean: 0.003546, std: 0.008065, n: 30}
    delta_min_cluster_recall@10_imbalanced_cap: {mean: 0.000709, std: 0.003885, n: 30}
    delta_min_cluster_recall@10_imbalanced_floor: {mean: 0.0, std: 0.0, n: 30}
    delta_min_cluster_recall@10_imbalanced_flat: {mean: 0.003239, std: 0.008619, n: 30}
    delta_min_cluster_recall@10_imbalanced_mmr_vs_flat: {mean: 0.001017, std: 0.009169, n: 30}
    delta_min_cluster_recall@10_imbalanced_rankmerge_vs_flat: {mean: 0.0015, std: 0.007531, n: 30}
    delta_cluster_coverage@10_imbalanced_mmr: {mean: 0.077778, std: 0.143394, n: 30}
    delta_nDCG@10_imbalanced_mmr: {mean: 0.005455, std: 0.038239, n: 30}
    delta_nDCG@10_imbalanced_rankmerge: {mean: 0.003936, std: 0.041515, n: 30}
    delta_min_cluster_recall@10_coherent_mmr: {mean: 0.000392, std: 0.002148, n: 30}
    delta_min_cluster_recall@10_random_mmr: {mean: 0.00084, std: 0.004603, n: 30}
    identity_drift_max: {mean: 0.0, std: 0.0, n: 90}
baselines_compared: [clustered_profile, flat_profile]
statistical_test: >-
  paired bootstrap over profiles, 10,000 resamples, seed 20260809,
  95% percentile interval

