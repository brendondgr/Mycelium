id: EXP-2026-08-005
slug: cluster-theme-spread-mechanisms
title: Theme-spread mechanisms for cluster-scoped ranking
status: complete
date_started: 2026-08-09
date_completed: 2026-08-09
authors: [brendondgr]

purpose: >
  EXP-2026-08-003 measured that cluster-scoped max-pooling concentrates the feed
  on one theme, and EXP-2026-08-004 measured that the per-theme slate cannot fix
  it because slate members are re-sorted below the global cut. No diversification
  machinery exists anywhere in the ranking stack. This experiment implements six
  candidate mechanisms as opt-in production code and measures each one alone and
  in combination, against both the deployed cluster-scoped ranking and the flat
  no-cluster ranking. It tests C-011, the remedy claim C-003's refutation implies
  but does not itself test.

hypothesis: >
  Stated before the run. (1) Selection mechanisms move the primary metric and the
  score mechanism may not, since only the former are guaranteed to reorder the
  surfaced 250. (2) The per-theme admission floor is inert at production
  surfacing, because the 250-item backstop binds before admission does — the same
  arithmetic that made the slate inert. (3) Spread costs relevance, and how much
  is the interesting question. (4) No prior hypothesis on which mechanism wins or
  on whether any combination beats the best individual.

