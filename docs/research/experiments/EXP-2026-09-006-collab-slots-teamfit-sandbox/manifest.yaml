id: EXP-2026-09-006
slug: collab-slots-teamfit-sandbox
title: Do funding calls become the right requirement slots, and is team coverage marked correctly? A synthetic-world test of plan CN-03
status: complete # planned | running | complete | failed | superseded
date_started: 2026-09-18
date_completed: 2026-09-18
authors: [brendondgr]

purpose: >
  The sandbox validation plan CN-03 must pass before it is retired: fictional
  funding calls with planted requirement slots, read by the real slot
  extractor, and the team-fit line marked for every lab and every person of
  EXP-2026-09-005's world against every call — scored against planted truth.

hypothesis: >
  Pre-registered in PROTOCOL.md, with three amendments each written before the
  arm it introduced. H1 invariants zero; H2 slot recall >= 0.85, precision >=
  0.80, role recall >= 0.80, required agreement >= 0.85; H3 lab coverage
  agreement on canonical method names >= 0.95; H4 near misses exploratory; H5
  the phase completes at scale. OUTCOME: arm A (s1) failed H2 recall and
  precision; arm B (s2) failed H2's required flag; arm C (s3, shipped) passed
  all: recall 0.876, precision 0.824, roles 1.0, required 0.978, lab coverage
  1.0. Coverage cosine left at 0.80 under the pre-registered rule (Q-044).

