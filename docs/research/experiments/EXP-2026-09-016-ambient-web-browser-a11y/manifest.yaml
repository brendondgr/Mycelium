id: EXP-2026-09-016
slug: ambient-web-browser-a11y
title: "Do the ambient web pages work in a real browser, from the keyboard, and pass WCAG 2.1 AA checks?"
status: complete
date_started: 2026-09-19
date_completed: 2026-09-19
authors: [brendondgr]

purpose: >
  Ambient Plans 07-08 web validation in a real browser: the Mylo & you page,
  the settings card, the lab and project cards, the reflection card's
  conversation proposals and the profile's "heard" marks, driven by a sandbox
  person's real history, with keyboard and axe-core WCAG 2.1 AA checks at
  desktop and phone width.

hypothesis: >
  Pre-registered: H1 every flow assertion passes; H2 the tabs follow the
  WAI-ARIA pattern and every ambient control is keyboard-reachable with a
  visible focus; H3 zero serious/critical axe violations in [data-ambient]
  regions; H4 no page scroll at 390 px and answer buttons >= 24x24; H5 no
  console errors. OUTCOME: run 1 fails H1 (the answer reply was lost on
  refetch) and H3 (12 serious color-contrast pairs); run 2 fails H1 (a first
  profile entry could not be undone) and H5; run 3 one harness failure; run 4
  (after fixes) passes all five.

