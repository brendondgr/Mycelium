id: EXP-2026-08-018
slug: rerank-ship-verification
title: "Shipping the cross-encoder rerank: flag-off invariance and on/off cost"
status: complete
date_started: 2026-08-22
date_completed: 2026-08-22
authors: [brendondgr]

purpose: >
  docs/skills/global.md requires a fresh evaluation run for any change to
  pipeline.py's ranking path. A cross-encoder rerank stage was added to the tail
  of fuse_interests_pool and fuse_clusters_pool, which the eval harness's profile
  arms also call -- so if turning it off is not identical to the code before it
  existed, every historical number in this record is in doubt. This verifies the
  invariant at both levels and measures what turning it on costs. It does NOT
  measure whether reranking helps: that is EXP-2026-08-015..017, it is a
  preference from one reader, and Q-033 is still open.

hypothesis: >
  The gate was fixed before any code was written, in
  docs/plans/cross-encoder-rerank.md at 0c1844f: "flag off => byte-identical;
  re-run the harness arms and diff against the committed run files; any
  difference is a bug in the wiring, not a result." OUTCOME: it holds. The
  fusion_dense_pool run file on sci-2026-train is cmp-identical to the one
  committed at ac56cee (R@100 0.5988, nDCG@10 0.2937), and on the production path
  the candidate set, pool size, combined scores and persist-row signal keys are
  all unchanged with the flag off. UNPREDICTED and unrelated to this change: with
  the flag OFF, fusing the same profile in separate processes can produce a
  different surfaced order, because combine_interests and combine_clusters
  iterate a set of str and Python randomizes string hashing per process. The
  deployed feed is not reproducible run to run. Recorded as Q-035.

