# BACK-FILLED on 2026-08-06. Shares its runs with EXP-2026-08-001 — the arms
# were executed once and answer two different questions. This folder derives the
# paired comparison rather than duplicating the run records.

id: EXP-2026-08-002
slug: dense-pool-vs-union-pool
title: What does confining the lexical channel to the dense-retrieved pool cost in recall?
status: complete
date_started: 2026-08-04
date_completed: 2026-08-05
authors: [brendondgr]

purpose: >
  The research audit's sharpest structural criticism of the ranking stack is
  that `build_bm25_index(list(pool.values()))` indexes only what vector
  retrieval already found, so the lexical channel can reorder a document but can
  never add one. That makes the deployed system's C-001 a reordering claim, not
  a recall claim. This ablation turns the criticism into a number by comparing
  the deployed dense-pool construction against a union pool at matched pool
  width and matched corpus scope.

hypothesis: >
  A union pool retrieves documents the dense channel misses, so R@100 rises,
  and the gain is larger where the dense channel is weaker.

