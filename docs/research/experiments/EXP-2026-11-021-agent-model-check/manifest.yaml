id: EXP-2026-11-021
slug: agent-model-check
title: Does Mylo work on the model just loaded? A thirty-turn check, one row per model
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-16
date_completed: 2026-11-16
authors: [Claude Opus 5.5 (agent), on behalf of the maintainer]

purpose: >
  Round three, Phase 4. A short, repeatable answer to "does Mylo work on the
  model that was just loaded?": thirty-one turns (twenty demo-lab questions,
  five access probes and two controls three times each over seeded world 101),
  one row per model in a table that grows. Pre-registers C-053 (no gate leak on
  any model) and C-054 (no blank turn on any model).

hypothesis: >
  Gate leaks are 0 and no turn ends blank on every model. No hypothesis about
  answer quality or speed.

