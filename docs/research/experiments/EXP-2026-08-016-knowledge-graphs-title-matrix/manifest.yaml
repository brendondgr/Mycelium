id: EXP-2026-08-016
slug: knowledge-graphs-title-matrix
title: "Same four arms, a second research area: knowledge graphs"
status: complete
date_started: 2026-08-22
date_completed: 2026-08-22
authors: [brendondgr]

purpose: >
  EXP-2026-08-015 gave a clean per-category winner on "Agentic AI in healthcare"
  -- one arm first on papers, grants and conferences and last on fellowships. One
  query cannot say whether that is a property of the arms or of that corner of
  the corpus. This repeats the identical measurement on a second declared
  research cluster, "knowledge graphs", with the same four arms and a third
  blinding. Same winner means there is a configuration to ship; a different
  winner means no single configuration is right for the whole product and the fix
  is routing rather than a parameter (Q-031, Q-032).

hypothesis: >
  None on which arm wins, by design -- the corpus has no relevance judgments, an
  LLM judge is the component EXP-2026-08-008 measured as non-monotonic in
  relevance, and the author's own reading is not evidence about what this
  researcher wants. OUTCOME on the answerable half: papers behave identically
  across the two areas (21 distinct documents across the four top-tens at mean
  pairwise Jaccard@10 of 0.29 here, 0.31 on healthcare). Grants and conferences
  are MORE convergent here (0.63 against 0.49 and 0.59). Fellowships flip
  completely: 0.53 on healthcare, 0.27 here with 25 distinct documents out of a
  possible 40 -- the least agreement in any cell of either experiment. Cost is
  uniformly lower for a two-word query and the shape is unchanged, with the
  reranked arm at ~16x the arm it reranks.

