id: EXP-2026-08-020
slug: theme-scoped-interest-context
title: "Theme-scoped interest context: production slate separation"
status: complete
date_started: 2026-08-23
date_completed: 2026-08-23
authors: [brendondgr]

purpose: >
  A reader with five research themes found the same knowledge-graph workshop
  leading the conference list of all five, including Computer Vision and
  Robotics. This measures the fix. search_interests appended the profile's whole
  keyword list to every area, and opportunity_search_interests merged every watch
  topic in first -- a 473-character shared suffix on a 24-character label, so all
  22 of that reader's searches were ~95% the same string and one document scored
  the normalised maximum on every interest at once. Context is now drawn from an
  interest's own theme's sibling areas instead, capped, and never from the
  implicit cluster.

hypothesis: >
  Pre-registered acceptance test, per category: five themes must produce five
  distinct rank-1 items. Predicted with it -- distinct items across the five
  slates rises, mean pairwise Jaccard falls, share present in every slate falls
  toward zero, and the candidate pool grows because five different questions
  retrieve five different sets. OUTCOME: all four categories pass and every
  prediction held. Papers 31 to 70 distinct items and Jaccard 0.75 to 0.20;
  grants 15 to 44 and 0.69 to 0.04; conferences 12 to 45 and 0.87 to 0.03;
  fellowships absent to 21 and 0.04. Items present in every slate go from 55/47/75
  per cent to zero everywhere. UNPREDICTED: the eval harness cannot see this
  change at all -- eval/harness/profiles.py builds SearchInterest directly and has
  never called the rewritten function, so every profile-arm number on record was
  measured on bare per-area queries production did not use until now.

