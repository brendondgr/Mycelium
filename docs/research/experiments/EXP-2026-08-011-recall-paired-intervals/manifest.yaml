id: EXP-2026-08-011
slug: recall-paired-intervals
title: Do the ladder's two surviving recall claims survive a paired confidence interval?
status: complete
date_started: 2026-08-22
date_completed: 2026-08-22
authors: [brendondgr]

purpose: >
  Q-022. EXP-2026-08-009 and EXP-2026-08-010 refuted C-013 and C-017 and showed
  that every nDCG@10 contrast re-tested from EXP-2026-08-008 spans zero at n=100.
  That left C-008 and C-014 -- both recall claims -- as the only positive findings
  in the ladder, and neither had ever had an interval computed. This computes them
  with the same harness.stats bootstrap that killed the others, so the survivors
  are held to the same bar rather than a lower one.

hypothesis: >
  Pre-registered. BOTH survive: the point estimates (+0.0523 and +0.0630 R@100)
  are an order of magnitude larger than the +/-0.04 nDCG@10 band this collection
  could not resolve, and recall counts set membership rather than position so it
  should be less brittle. Falsifier stated in advance: either interval includes
  zero, in which case the ladder has produced no surviving positive finding.
  OUTCOME: both confirmed. C-008 +0.0523 [+0.0235, +0.0858], 28W/10L, p=0.0051.
  C-014 +0.0630 [+0.0396, +0.0923], 39W/3L, p=5.6e-09 -- the most consistent
  effect measured anywhere in the ladder. Both also move nDCG@100 significantly,
  so the recall reaches the ranking. An unplanned finding: two-channel fusion is
  significantly WORSE than BM25 on recall (-0.0392), recorded as C-018.

