id: EXP-2026-11-005
slug: fulltext-coverage-own-ids
title: Full-text coverage after the PubMed id repair (Q-057)
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-08
date_completed: 2026-11-08
authors: [Brendon (with Claude, Opus 5.5)]

purpose: >
  Answers Q-057: re-runs EXP-2026-11-004's frozen 200-paper sample after the
  PubMed scraper stopped storing cited papers' identifiers, with the ids the
  repair command (repair_pubmed_ids) writes, against a same-day control on the
  stored ids. Supports no paper claim; it sizes the corpus bug and the
  full-text tool on a clean corpus.

hypothesis: >
  identifier_mismatch falls from 28 to at most 3, and full_text_rate rises
  from 0.54 to at least 0.60 (stated in PROTOCOL.md before the run).

