id: EXP-2026-09-017
slug: ambient-reports-routing-sandbox
title: "Does what changed reach the right reports, and only them?"
status: complete
date_started: 2026-09-19
date_completed: 2026-09-19
authors: [brendondgr]

purpose: >
  Ambient Plan 09 sandbox validation: the weekly's "What changed" and the
  daily's "Changed today" reach exactly the reports they should (personal to
  the person; shared lab project changes to the lab and each member; unshared
  ones to members only), every [O#] resolves, and the interpretation line
  appears only when explorations move the ranking.

hypothesis: >
  Pre-registered: H1 zero routing violations; H2 every [O#] resolves; H3 the
  interpretation line absent with drift off and present exactly for people
  with a confirmed, not-undone exploration with drift on; H4 dailies carry
  "Changed today" iff the rule says so and no lab daily carries a development
  line; H5 under 60 minutes. OUTCOME: run 1 reported 11 violations, all the
  harness's substring matching; run 2 (row matching; an undo in the same week
  now a mark) 0 violations. The model's use of [O#] was not exercised (no
  feed items in the sandbox).

