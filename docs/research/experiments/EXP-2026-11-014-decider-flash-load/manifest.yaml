id: EXP-2026-11-014
slug: decider-flash-load
title: "pplx-decider-flash load test on the local decision server"
status: complete
date_started: 2026-11-12
date_completed: 2026-11-13
authors: [Claude (agent), Brendon (owner)]

purpose: >
  How much load the local decision server (pplx-decider-flash-v1.2-fp8 behind
  the protocol-v3 adapter, one Quadro RTX 5000) takes — throughput, latency
  and errors from 1 to 64 requests in flight on the real rerank states — and
  whether its answers are stable under batching and under load. Descriptive;
  supports no claim.

hypothesis: >
  From the operator: throughput stops rising after about 16 in flight and the
  server may crash above 64. Expected: a plateau between 8 and 16, no errors up
  to 64, joint and single answers within 0.05 on most questions. Falsifier
  stated in advance: joint-vs-single disagreement on the most likely answer
  for more than 5% of questions.

