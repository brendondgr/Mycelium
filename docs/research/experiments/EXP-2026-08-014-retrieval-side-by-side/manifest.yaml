  # the runner (POOL_PER_INTEREST=100, RERANK_DEPTH=50, BLIND_ORDER).
  path: docs/research/experiments/EXP-2026-08-014-retrieval-side-by-side/code/run.py
  hash: null
data:
  name: Mycelium production ContentItem store (development deployment)
  version: "compose postgres (pgvector/pgvector:pg17) at localhost:11450; papers 35,205, grants 2,171, conferences 912, fellowships 818"
  split: test
  n_examples: 120 # ranked lists = 10 arms x 3 queries x 4 content types
  qrels: "none -- no relevance judgments exist for this corpus (W5). The judgment instrument is a blinded human preference booklet; see PROTOCOL.md."
  hash: null
  card: null # docs/research/datasets/cards/<name>.md
