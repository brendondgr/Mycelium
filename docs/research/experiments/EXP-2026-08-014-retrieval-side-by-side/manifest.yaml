id: EXP-2026-08-014
slug: retrieval-side-by-side
title: Side-by-side top-10 lists across retrieval arms, for human preference
status: complete
date_started: 2026-08-22
date_completed: 2026-08-22
authors: [brendondgr]

purpose: >
  Thirteen experiments have reported aggregate metrics on an external collection
  and nobody has looked at the documents. This runs ten retrieval configurations
  over Mycelium's own corpus for three queries in the user's own field, across
  all four content types, and typesets the resulting 120 top-ten lists as a
  BLINDED booklet for the user to judge. It answers, on its own, the half of the
  question that needs no judgment -- do the arms return different things at all
  -- and hands the other half to the person whose feed it is. The prompt was the
  user's suspicion that LongEval-Sci may be measuring a different problem from
  profile-to-feed.

hypothesis: >
  Deliberately none on which arm wins: there are no relevance judgments for this
  corpus, an LLM judge is the component EXP-2026-08-008 measured as non-monotonic
  in relevance, and the author's own opinion of a grant listing is not evidence.
  The protocol fixes procedure and presentation only. OUTCOME on the answerable
  half: the arms disagree far more than the benchmark implies -- mean pairwise
  Jaccard@10 of 0.475, and on papers 34 distinct documents across the ten
  top-tens with ZERO unanimous. Since the record's resolution limit on LongEval
  is about +/-0.04 nDCG@10 at n=100, arms that are statistically
  indistinguishable there are not interchangeable here. Unpredicted: reading the
  lists exposed duplicate rows in the store (207 paper rows, 105 untitled) that
  consume top-ten slots and that no aggregate metric had flagged.

