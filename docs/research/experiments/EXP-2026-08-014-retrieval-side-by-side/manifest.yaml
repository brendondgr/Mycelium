  lockfile: eval/uv.lock
  container: "pgvector/pgvector:pg17 for the store; the arms run on the host"
compute:
  hardware: "32 CPU cores, 121 GB RAM, no CUDA device"
  wall_clock_hours: 0.45 # 25 min SPLADE encode (one-time) + 1.5 min for all arms
  estimated_cost_usd: null

# --- Results block -----------------------------------------------------------
# Single-run numbers still declare n so a reader is never guessing.
metrics:
  primary: mean pairwise Jaccard@10 between arms (agreement, not quality)
  values:
    agreement__mean_pairwise_jaccard10__overall: 0.475 # n=12 cells x 45 arm pairs; by document id 0.477
    agreement__mean_pairwise_jaccard10__papers: 0.339 # 34.0 distinct docs across ten top-10s, 0 unanimous
    agreement__mean_pairwise_jaccard10__grants: 0.701 # 16.7 distinct, 5.0 unanimous -- the most convergent corpus
    agreement__mean_pairwise_jaccard10__conferences: 0.392
    agreement__mean_pairwise_jaccard10__fellowships: 0.467
    agreement__distinct_documents_across_ten_top10s: 26.2 # 10 = identical arms, 100 = disjoint
    agreement__unanimous_documents: 2.33
    corpus__duplicate_paper_rows_by_title: 207 # 0.6%; plus 105 untitled papers
    corpus__top10_slots_lost_to_duplicates: 14 # across all 120 ranked lists
    latency__bm25_only__seconds_per_query: 0.008
    latency__fusion_dense_pool__seconds_per_query: 0.069 # production as deployed
    latency__fusion_union_splade__seconds_per_query: 0.083
    latency__cross_encoder_arms__seconds_per_query: 1.416 # median across the five +xenc arms (0.944-1.463)
    cost__splade_encode_35205_papers_seconds: 1381 # one-time; 25.5 docs/s, incremental for new ingest
baselines_compared: [bm25_only, dense_only, fusion_dense_pool]
statistical_test: null # by design -- this experiment reports composition and cost, and elicits a preference

