id: EXP-2026-08-017
slug: splade-vs-dense-reranked
title: Three channels + cross-encoder against the dense pool + cross-encoder
status: complete
date_started: 2026-08-22
date_completed: 2026-08-22
authors: [brendondgr]

purpose: >
  EXP-2026-08-015 and EXP-2026-08-016 both gave first place to
  fusion_dense_pool+xenc and the three-channel arm won nothing -- but in both
  booklets the three-channel arm was BARE, so every comparison changed two things
  at once: how the pool was built and whether anything reranked it. This gives
  both pools the identical cross-encoder over their own top 50, leaving the pool
  as the only difference. Two arms, two queries (Agentic AI in healthcare,
  knowledge graphs), four content types, sixteen lists, blinded K/V.

hypothesis: >
  Pre-registered with all three outcomes and what each would mean, before either
  arm was scored. Dense pool still preferred => the pool restriction C-008 calls
  a defect is doing something useful and C-023 becomes a claim about the pool.
  Three-channel preferred once reranked => the previous six firsts were about the
  missing reranker, not the pool, and C-008/C-014's production implications
  return. Indistinguishable => the pool does not matter at top-10 once a reranker
  is present and the cheaper arm wins by default. No verdict is computed here --
  the judgment is the reader's. OUTCOME on the answerable half: the reranker
  largely erases the pool difference. Healthcare grants are byte-identical
  (Jaccard@10 = 1.00) and healthcare papers agree exactly through rank 7,
  diverging only at 8. Median overlap across the eight cells is ~0.54 against
  0.27-0.63 pairwise in the four-arm booklets. The exception is knowledge-graph
  fellowships at 0.25, the least agreement of any cell.

