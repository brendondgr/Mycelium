# Single-run numbers still declare n so a reader is never guessing.
metrics:
  primary: bm25_reachability@100 (share of the corpus-wide BM25 top-100 already inside the dense pool)
  values:
    reachability__deployed_regimes__median: 0.610 # n=757 interest queries; mean 0.583 CI [0.571, 0.595]; pre-registered verdict "between"
    reachability__deployed_regimes__real_targets_median: 0.630 # n=697; mean 0.603 CI [0.592, 0.615]
    reachability__R1_papers_day_scoped__median: 0.640 # n=646; mean 0.600 CI [0.587, 0.613]; "between"
    reachability__R3_opportunities__median: 0.440 # n=111; mean 0.482 CI [0.455, 0.511]; "live"
    reachability__R2_papers_corpus_wide__median: 0.490 # n=38; mean 0.427 CI [0.389, 0.461]; not a deployed regime
    union_only_entrants__deployed_gate: 0 # summed over 126 (regime, target) pairs, all four union arms
    union_only_entrants__completed_gate__a2p: 7440 # same pairs, cosine gate computed over the whole pool
    reordered_in_entrants__deployed_gate__a2p: 419 # documents already in the dense pool, re-ranked into the surfaced set
    pool_growth__union_over_dense__median: 1.54
    novel_share__union_pool__median: 0.35
    q018__emitted_per_interest_after_0_15_floor__median: 113 # p10 61, p90 128; 61% of the target's pool survives
    q018__surfaced_per_target_after_cosine_threshold__median: 150 # R1 median 148; 250 backstop binds in 1 of 102 R1 pairs
    fts_websearch__interest_queries_returning_nothing: 728 # of 798 (91%); OR semantics: 4 of 798, median reachability 0.540
    premise__declared_interest_words__median: 3 # 45% are 1-2 words, 95% are <= 4
    premise__production_paper_tokens__median: 239 # LongEval 161 (2026) / 185 (2025-01); grants 116, conferences 86
baselines_compared: [a1_dense_pool]
statistical_test: "percentile bootstrap (harness.stats), 10,000 resamples, seed 20260821 -- applied to a LEVEL, not a paired contrast; there is no baseline arm to pair against without relevance labels (ISSUES.md 6)"

