id: EXP-2026-08-013
slug: production-pool-contrast
title: "Q-001: does the union pool's advantage survive on the production corpus?"
status: complete
date_started: 2026-08-22
date_completed: 2026-08-22
authors: [brendondgr]

purpose: >
  Q-001, open since EXP-2026-08-002 and the last gate between the eval programme
  and a production change. Twelve experiments measured the pool contrast on
  LongEval-Sci, which is query -> documents; Mycelium is declared-interest
  profile -> feed. This runs the contrast on the real ContentItem store against
  the real declared interests of the real targets, through the deployed
  functions. There are no relevance judgments for this corpus (W5 not started),
  so it answers the mechanism half of Q-001 -- is there anything for a wider pool
  to reach, and does it survive the deployed surfacing gates -- and leaves the
  value half explicitly open. That asymmetry is pre-registered as the design.

hypothesis: >
  Pre-registered with a two-branch decision rule and a deliberate gap between the
  branches. INERT (do not ship, Q-001 closes negative): median
  bm25_reachability@100 >= 0.90 in the deployed regimes AND no surfaced entrants.
  LIVE (mechanism confirmed, value still blocked on W5): median reachability
  <= 0.50 AND entrants for a majority of pairs. Anything between: report the
  curve, change no recommendation. OUTCOME: the inert branch did not fire
  anywhere. Deployed opportunity feeds are LIVE (median 0.440); the deployed
  paper feed lands BETWEEN (0.610) and is reported as between, not rounded up.
  UNPREDICTED and decisive for the engineering: zero union-only documents reach
  the surfaced feed under the deployed gate, in all four union arms and all 126
  (regime, target) pairs, because fuse_interests_pool gates on a best_cosine that
  _build_pool populates only from the dense channel. Also unpredicted: half of
  Q-001's own premise is false -- declared interests are not longer than LongEval
  queries (median 3 words, 95% <= 4) and production documents are not
  categorically longer (papers 239 tokens vs 161-185; grants 116, conferences 86).

