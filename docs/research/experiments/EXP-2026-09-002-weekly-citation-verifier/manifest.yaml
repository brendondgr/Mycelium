id: EXP-2026-09-002
slug: weekly-citation-verifier
title: Does the citation verifier agree with a person?
status: complete # amended scope (Amendment 1): census, rebuild test, injected-error recall; the human labelling could not be done — see RESULTS.md
date_started: 2026-09-11
date_completed: 2026-11-12
authors: [brendondgr, Claude (agent)]

purpose: >
  The weekly removes model-written sentences that fail three checks, and removal
  is a strong action nobody has measured. This asks how often the checks remove a
  supported sentence, how often they keep an unsupported one, and whether adding
  an entailment call earns the model call it costs. Supports C-025.

hypothesis: >
  Stated so it can be refuted: the deterministic checks will have high removal
  precision and poor recall — they catch inventions that show up as a number or a
  bad citation, and miss the ones that are ungrounded in meaning alone. If that
  is right, the entailment check is where the recall has to come from and the
  cost is justified; if recall is already high, it is not.

