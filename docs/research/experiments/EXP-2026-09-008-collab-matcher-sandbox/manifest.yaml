id: EXP-2026-09-008
slug: collab-matcher-sandbox
title: Does the matcher find the right people in the right lane, and nobody it should not? A 600-person synthetic test of plan CN-05
status: complete # planned | running | complete | failed | superseded
date_started: 2026-09-18
date_completed: 2026-09-19
authors: [brendondgr]

purpose: >
  Plan CN-05's sandbox validation: does the matcher return, in the right
  lane, people who really hold what is needed — and never anyone the gate,
  the tier rule or the conversation boundary should keep out?

hypothesis: >
  Pre-registered: H1 zero invariant violations; H2 method-bridge hit rate and
  precision >= 0.80; H5 load p95 <= 2 s with the cap holding. OUTCOME: H1 and
  H5 hold in every arm; H2 fails as registered (precision 0.98, hit rate
  0.46; 0.57 with the post-hoc slot-by-slot fill) — over gap slots only, the
  slots a bridge searches, the hit rate is 1.0 (declared diagnostic).

