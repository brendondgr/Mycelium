id: EXP-2026-08-009
slug: crossencoder-paired-intervals
title: Does the cross-encoder's advantage over BM25 survive a paired confidence interval at 492 queries?
status: complete
date_started: 2026-08-21
date_completed: 2026-08-22
authors: [brendondgr]

purpose: >
  EXP-2026-08-008 reported that a cross-encoder is the first stage in this
  repository to beat BM25, on a margin of +0.0087 nDCG@10 at n = 100 with no
  confidence interval computed, and recorded that margin as C-013 supported. This
  record has twice before been unable to separate an effect that size from no
  effect (Q-011, Q-013). Q-016 asks whether the advantage survives a paired
  bootstrap interval, on sci-2025-01's 492 queries. It does not: no contrast on
  either snapshot shows a significant gain, and on the larger query set the
  cross-encoder is significantly harmful.

hypothesis: >
  Genuinely pre-registered — PROTOCOL.md was written before any arm on
  sci-2025-01 ran and before the BM25-base rerank arm existed anywhere.
  PRIMARY: a cross-encoder reranking the strongest available first stage beats it
  on nDCG@10 with a 95% paired interval excluding zero. Falsifier stated in
  advance: the interval includes zero, or the point estimate is negative.
  SECONDARY: the fusion-based variant will NOT replicate here, because the dense
  channel is far weaker on this snapshot.
  OUTCOME: the primary hypothesis is FALSIFIED. On sci-2026-train no contrast
  excludes zero (the headline +0.0088 has sign p = 0.91). On sci-2025-01 the
  cross-encoder is significantly worse than BM25 at both depths (-0.0439 and
  -0.0541, both intervals excluding zero, sign p < 1e-4), losing on 218 of 492
  queries. Harm concentrates on short keyword queries and vanishes at 5+ words.

