id: EXP-2026-08-006
slug: extraction-throughput
title: LLM structured-extraction throughput by reasoning level and concurrency
status: complete # planned | running | complete | failed | superseded
date_started: 2026-08-16
date_completed: 2026-08-16
authors: [brendondgr]

purpose: >
  How long does the one-time structured-extraction backfill (~4,424 opportunity
  records, plan D9/D10) actually take against Mycelium's own LLM endpoint, and
  how does it change with reasoning effort and worker concurrency? The plan
  carried a 5-6 hour estimate extrapolated from the standalone collector's
  published throughput table, which measured a different server entirely. This
  experiment exists so that number traces to evidence about this system.

hypothesis: >
  Stated before the run: the collector's 25-49s median latency is a property of
  its endpoint, not a floor. Against this endpoint with reasoning off, median
  latency will be substantially lower and the backfill will finish well inside
  an hour at 12 workers. A third directional expectation was also recorded:
  higher reasoning might still win on wall-clock if it produced schema-valid
  output more often.
  OUTCOME: latency confirmed (2.96s median, 1.09-1.70h projected). The third
  expectation was half right in an unanticipated way: reasoning barely moved
  first-attempt validity (0.44-0.53 across every arm) but moved the REFUSAL
  rate enormously (34.4% off versus 6.2% on), so speed and coverage trade
  directly rather than reinforcing.

