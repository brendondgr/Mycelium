id: EXP-2026-08-001
slug: longeval-retrieval-baseline
title: Does the deployed retrieval and fusion stack beat BM25 on an external scholarly collection?
status: complete
date_started: 2026-08-04
date_completed: 2026-08-05
authors: [brendondgr]

purpose: >
  The ranking stack had no external measurement of any kind. This is workstream
  W2 from the research audit and the cheapest decisive falsification test of
  C-001: run the production retrieval, lexical, and fusion code unchanged
  against LongEval-Sci, a scholarly collection with judgments and published
  baselines, and find out whether hybrid fusion is worth its cost. If it is not,
  the retrieval layer has no defensible claim and the project should reallocate
  to the funding and routing halves.

hypothesis: >
  RRF fusion over a dense-retrieved pool orders scholarly search results better
  than dense retrieval alone, and competitively with a strong BM25 baseline. The
  falsifying result — stated in advance — is BM25 alone outranking every fusion
  arm on nDCG@10.

