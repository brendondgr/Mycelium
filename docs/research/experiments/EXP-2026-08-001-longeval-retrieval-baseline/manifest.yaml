# --- Results block -----------------------------------------------------------
# n=1 on every value: the arms are deterministic (fixed embeddings, exact
# similarity, no ANN index in production), so a repeat run reproduces the number
# exactly. There is no seed variance to average over, and reporting one would be
# a fiction.
#
# The headline is `fusion_dense_pool` on the 2026 training snapshot, pooled
# scope, pool width 100 — the arm that IS the deployed configuration, not the
# best arm. On the same row BM25 alone scores nDCG@10 0.3212, which is the
# finding. Reporting the winner here would hide it. All 33 rows: data/metrics.csv.
metrics:
  primary: nDCG@10
  values:
    nDCG@10: {mean: 0.2937, std: null, n: 1}
    nDCG@100: {mean: 0.3829, std: null, n: 1}
    AP: {mean: 0.2360, std: null, n: 1}
    R@100: {mean: 0.5988, std: null, n: 1}
    RR: {mean: 0.4589, std: null, n: 1}
    P@10: {mean: 0.2010, std: null, n: 1}
baselines_compared:
  - "BM25 (PyTerrier, LongEval'26 organizers)"
  - "Qwen3-Embedding-4B (LongEval'26 organizers)"
  - bm25_only
  - dense_only
statistical_test: null

