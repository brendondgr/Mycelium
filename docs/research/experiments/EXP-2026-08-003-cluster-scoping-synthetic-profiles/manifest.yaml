# --- Results block -----------------------------------------------------------
# The primary value is the paired delta in min_cluster_recall@10, clustered
# minus flat, under the `imbalanced` grouping at the deployed beta of 0.15 —
# the condition C-003 names. It is negative and its interval excludes zero, so
# the claim is refuted in its own target condition. `n` is the number of paired
# profiles, not the number of runs; `std` is the standard deviation of the
# per-profile deltas. All 72 rows: data/metrics.csv.
#
# The `random` rows are the negative control and are recorded because they are
# larger than the semantic conditions, not smaller — see RESULTS.md §4.
metrics:
  primary: delta_min_cluster_recall@10_imbalanced
  values:
    delta_min_cluster_recall@10_imbalanced: {mean: -0.003239, std: 0.008619, n: 30}
    delta_min_cluster_recall@10_coherent: {mean: 0.000952, std: 0.005216, n: 30}
    delta_min_cluster_recall@10_random: {mean: 0.000777, std: 0.011903, n: 30}
    delta_cluster_gini@10_imbalanced: {mean: 0.005556, std: 0.175312, n: 30}
    delta_cluster_gini@10_coherent: {mean: 0.054444, std: 0.186823, n: 30}
    delta_cluster_coverage@10_imbalanced: {mean: -0.044444, std: 0.144724, n: 30}
    delta_nDCG@10_imbalanced: {mean: -0.010136, std: 0.048285, n: 30}
    delta_nDCG@10_coherent: {mean: -0.009967, std: 0.051593, n: 30}
    delta_R@100_random: {mean: 0.039507, std: 0.042450, n: 30}
baselines_compared: [flat_profile]
statistical_test: >-
  paired bootstrap over profiles, 10,000 resamples, seed 20260809,
  95% percentile interval

