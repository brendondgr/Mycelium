id: EXP-2026-08-003
slug: cluster-scoping-synthetic-profiles
title: Does cluster-scoped ranking protect a starved theme?
status: complete
date_started: 2026-08-09
date_completed: 2026-08-09
authors: [brendondgr]

purpose: >
  C-003 is the most distinctive idea in the codebase and the one with the
  thinnest literature behind it: that combining within research clusters and
  max-pooling across them stops one vocabulary-dominant theme from monopolising
  a feed. It is a coverage claim, and no standard IR metric can see it — nDCG
  over a union of judgments is blind to which theme a relevant document came
  from. This experiment constructs synthetic multi-cluster profiles from
  LongEval-Sci queries, so the cluster code path fires at all, and measures the
  deployed flat and cluster-scoped aggregation paths against per-cluster
  coverage metrics with the grouping mode as a controlled variable.

hypothesis: >
  Clustered aggregation raises min_cluster_recall@10 relative to flat, most
  under the `imbalanced` grouping, not at all under `random`, and the gap widens
  with beta. None of the three held.

