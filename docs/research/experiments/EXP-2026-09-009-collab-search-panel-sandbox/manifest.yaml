id: EXP-2026-09-009
slug: collab-search-panel-sandbox
title: Does the collaborator search panel work end to end for hundreds of fake seekers, and does every response stay a coarse pointer? A sandbox test of plan CN-06
status: complete # planned | running | complete | failed | superseded
date_started: 2026-09-18
date_completed: 2026-09-19
authors: [brendondgr]

purpose: >
  Plan CN-06's sandbox validation: every entry point of the collaborator
  search through the real API for many fake seekers, and the panel in a real
  browser at desktop and phone width.

hypothesis: >
  Pre-registered (resized pre-run, ISSUES 2): zero shape, privacy and refusal
  violations; saved list correct; browser assertions pass. OUTCOME: 0 API
  violations over 130 searches; browser passes at both widths after two
  product fixes (own-words reading; Escape after Run).

