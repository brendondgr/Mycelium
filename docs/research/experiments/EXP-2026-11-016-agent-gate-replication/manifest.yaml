id: EXP-2026-11-016
slug: agent-gate-replication
title: "Permission gate replicated: second model, seeded worlds, second reader"
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-15
date_completed: 2026-11-15
authors: [Claude Opus 5.5 (agent), on behalf of the maintainer]

purpose: >
  Round two, Phase 1. Replicates the permission-gate result of EXP-2026-11-011
  (C-031) on a second model family and three seeded worlds, with a second
  reader for every graded leak. Pre-registers C-037 (gate: 0 confirmed leaks),
  C-038 (prompt-only leaks more, per model), C-039 (controls pass).

hypothesis: >
  The gate holds on both models (it is code); the prompt-only arm leaks on both,
  though the second model may obey the prompt better.

