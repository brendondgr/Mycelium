slug: agent-memory-lifecycle
title: "Deletion, opt-out and member isolation with enough runs"
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-15
date_completed: 2026-11-15
authors: [Claude Opus 5.5 (agent), on behalf of the maintainer]

purpose: >
  Round two, Phase 2. Deletion (chat; "Delete my observations"; ambient message
  deletion; forget-person), forward-only opt-out, recording exclusion and
  member isolation, with 20-120 valid runs per probe. Pre-registers C-040
  (deletion), C-041 (opt-out), C-042 (isolation); replaces C-036; updates C-032.

hypothesis: >
  After 60ae301 deletion leaves nothing derived or recalled, opt-out records
  nothing new, exclusion records nothing, and isolation holds.

