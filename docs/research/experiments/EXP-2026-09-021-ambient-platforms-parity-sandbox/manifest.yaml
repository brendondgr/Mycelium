id: EXP-2026-09-021
slug: ambient-platforms-parity-sandbox
title: "Do Slack and Teams change anything past the adapter?"
status: complete
date_started: 2026-09-19
date_completed: 2026-09-19
authors: [brendondgr]

purpose: >
  Ambient Plan 11's own test: adding Slack and Teams must change nothing past
  the adapter. The same corpus, people and consent replayed through Discord,
  Slack's signed Events API and Teams' Bot Framework endpoint (real RS256
  tokens), compared from the ledger.

hypothesis: >
  H1 identical kept multiset (speaker, content hash); H2 identical drop
  counters; H3 Slack keeps Mylo's own DM lines like Discord, Teams none (not
  delivered to bots); H4 every request passes its endpoint; H5 under 30 min.
  OUTCOME: all hold in run 1 (registered) and run 2 (post hoc gate mix: 339
  not opted in, 102 free, 146 no account, 129 too short, identical on all
  three); Teams misses 23 Mylo lines as predicted.

