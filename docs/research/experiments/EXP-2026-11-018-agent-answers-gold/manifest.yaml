  branch: main
  entrypoint: "docker compose run --rm --no-deps -T backend uv run --no-sync --project web/backend python docs/research/experiments/EXP-2026-11-018-agent-answers-gold/code/run.py --conc 3; python3 docs/research/experiments/EXP-2026-11-018-agent-answers-gold/code/grade.py"
  dirty: true  # other agents' uncommitted experiment files in the same checkout; no product code
config:
  path: "tools/agent/tool.py (defaults) + AGENT_PARALLEL_CALLS=0"
  hash: null
data:
  name: "60 gold-graded questions over the demo lab (code/questions.json, data/gold.json)"
