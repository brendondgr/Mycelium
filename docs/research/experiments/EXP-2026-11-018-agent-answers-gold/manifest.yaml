id: EXP-2026-11-018
slug: agent-answers-gold
title: "Mylo answers graded by code against stored facts"
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-15
date_completed: 2026-11-15
authors: [Claude (agent), Brendon (owner)]

purpose: >
  When the demo lab's PI asks Mylo a question whose answer is stored in the
  database, how often is the answer exactly right, graded by code against a
  gold set computed from the database before any answer was generated; and is
  it better than one search plus one model call, and than Mylo without its
  lab, project and people functions? Tests C-043 to C-046 (new rows beside
  C-033/C-034, which need people).

hypothesis: >
  C-043: arm (a) full credit on at least 70% of answerable runs. C-044: arm (a)
  beats arm (b) (paired bootstrap interval excludes zero). C-045: arm (a) beats
  arm (c) on project, people and join questions. C-046: arm (a) states a fact
  on at most 10% of unanswerable runs.

