# --- Results block -----------------------------------------------------------
# The primary value is the paired delta in whole-set theme coverage, slate minus
# the cluster path, under the `imbalanced` grouping — the condition C-003 names.
# It is positive and its interval excludes zero at a binding 30-item cut, and
# falls by half with an interval spanning zero once the cluster path is given the
# slate's own 34 slots (pre-registered falsifier 3). `n` is paired profiles.
#
# Whole-set (`@1000`) is the reported depth because the slate's additions sort
# below the global cut by construction, so no top-k at or below that cut can
# observe them at all — every `@10` and `@30` delta here is exactly 0.0. See
# ISSUES.md; this corrects a flaw in the pre-registered metric set.
#
# `identical_surfaced_set_share_prod` is 1.0: at production surfacing the slate
# and the plain cluster path emit the same set for every profile, so the
# mechanism is inert there and no metric could separate them.
metrics:
  primary: delta_cluster_coverage@1000_imbalanced_cut30
  values:
    delta_cluster_coverage@1000_imbalanced_cut30: {mean: 0.066667, std: 0.135613, n: 30}
    delta_cluster_coverage@1000_imbalanced_matched: {mean: 0.033333, std: 0.101710, n: 30}
    delta_cluster_coverage@1000_coherent_cut30: {mean: 0.011111, std: 0.060858, n: 30}
    delta_cluster_coverage@1000_random_cut30: {mean: 0.011111, std: 0.060858, n: 30}
    delta_min_cluster_recall@1000_imbalanced_cut30: {mean: 0.008792, std: 0.024991, n: 30}
    delta_min_cluster_recall@1000_imbalanced_matched: {mean: 0.003793, std: 0.026162, n: 30}
    delta_cluster_gini@1000_imbalanced_cut30: {mean: -0.049997, std: 0.095362, n: 30}
    delta_cluster_gini@1000_imbalanced_matched: {mean: -0.026550, std: 0.086468, n: 30}
    identical_surfaced_set_share_prod: {mean: 1.0, std: 0.0, n: 3}
    mean_surfaced_slate_cut30_imbalanced: {mean: 33.77, std: null, n: 30}
baselines_compared: [flat_profile, clustered_profile]
statistical_test: >-
  paired bootstrap over profiles, 10,000 resamples, seed 20260809,
  95% percentile interval

