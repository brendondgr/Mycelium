id: EXP-2026-08-004
slug: cluster-slate-theme-protection
title: Does the per-theme slate protect a starved theme?
status: complete
date_started: 2026-08-09
date_completed: 2026-08-09
authors: [brendondgr]

purpose: >
  EXP-2026-08-003 refuted C-003 for the cluster path's *global* max-pooled
  ranking, but measured only the surfacing an individual's feed uses
  (cluster_top_n = 0). The lab feed additionally emits a per-theme slate —
  each cluster's own best n candidates by that cluster's score
  (fusion.top_per_cluster) — aimed at exactly the failure that experiment
  demonstrated, and it had never been measured. This experiment adds a third
  arm for it (Q-010) and tests it under production surfacing, under a cut that
  binds, and against a size-matched baseline.

hypothesis: >
  The slate raises per-theme coverage over both the flat and the
  cluster-scoped-global paths, most under the imbalanced grouping, because it
  guarantees every theme a fixed allocation regardless of that theme's absolute
  score. It survives neither the production condition nor the size-matched
  control.

