id: EXP-2026-09-015
slug: ambient-dialogue-replies-sandbox
title: "Does Mylo read replies in people's own words right, never turn a no into a yes, and catch \"stop asking\"?"
status: complete
date_started: 2026-09-19
date_completed: 2026-09-19
authors: [brendondgr]

purpose: >
  Plan 06 (ambient confirmation dialogue) sandbox validation: whether Mylo's
  reply reader understands answers written in people's own words and never
  turns a no, a not-now, or a noncommittal reply into a change; whether a
  yes or no applied through the dialogue has exactly the effect its reading
  implies; and whether "stop asking" is caught without tripping on ordinary
  messages.

hypothesis: >
  Pre-registered: H1 at most 1% of no / not-now / ambiguous / off-topic replies
  read as a yes or correction; H2 overall reading accuracy >= 0.85, yes and no
  >= 0.90, ambiguous and off-topic read as unclear >= 0.70; H3 zero effect
  mismatches; H4 the literal shut-off list catches >= 0.80 of requests and
  trips on <= 0.05 of decoys; H5 under 60 minutes at <= 16 concurrent calls.
  OUTCOME (run 1, registered): H1 fails (0.24, the stop condition), H2 fails,
  H3 1 mismatch, H4 fails (0/40), H5 holds. Post hoc (runs 2-4, fixes between
  them, same world): reader r4 H1 0.0079, H2 still fails (overall 0.80; misses
  on the safe side), H3 1 real mismatch fixed after the run, H4 literal list
  still fails but the model-read control catches 40/40 with 0/40 decoys.

