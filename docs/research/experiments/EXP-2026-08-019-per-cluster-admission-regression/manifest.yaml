id: EXP-2026-08-019
slug: per-cluster-admission-regression
title: "Per-cluster admission: harness regression check"
status: complete
date_started: 2026-08-23
date_completed: 2026-08-23
authors: [brendondgr]

purpose: >
  docs/skills/global.md requires a fresh evaluation run for any change to
  pipeline.py's ranking path. The per-cluster redesign replaced the single
  absolute cosine threshold in fuse_clusters_pool with a two-part gate -- the
  absolute floor OR a candidate reaching CLUSTER_ADMIT_FRAC of its own theme's
  best score, with CLUSTER_ADMIT_HARD_FLOOR beneath both. Two harness arms call
  that function with a real match_threshold, so this checks whether anything
  already on record moved. It does NOT measure whether the gate improves the
  product: the harness has no reader with several competing research themes,
  which is the entire situation the gate exists for.

hypothesis: >
  The relative floor admits strictly more candidates, so the surfaced set can
  only grow. But both arms already surface at the surface_limit=250 backstop, so
  the extra admissions should be truncated before scoring and the metrics should
  be unchanged. OUTCOME: confirmed. Diagnostics are byte-identical for both arms
  (mean_surfaced 250.0, mean_pool 574.47, clusters_cleared {1: 6692, 2: 790,
  3: 18}), and clustered_profile's metrics are identical to six decimals against
  its newest same-hash baseline. UNPREDICTED: slate_profile shows +0.0208
  nDCG@10 against its only same-hash baseline, but that baseline is two commits
  stale and clustered_profile shows the identical shift at the same older commit
  and zero at the newer one -- so the shift is not this change. Most likely the
  ir_measures tie-ordering behaviour, given identical diagnostics.

