id: EXP-2026-09-005
slug: knowledge-demonstrated-sandbox
title: Do people's papers become the right demonstrated concepts? A synthetic-world test of plan CN-02
status: complete # planned | running | complete | failed | superseded
date_started: 2026-09-18
date_completed: 2026-09-18
authors: [brendondgr]

purpose: >
  The sandbox validation plan CN-02 must pass before it is retired: people's
  own papers read by the work-facet extractor, linked into the knowledge graph,
  and rolled up onto the person — run at scale with the real local model on a
  synthetic world whose truth is planted, and scored against it. Also the first
  data point of the shared concept-merge experiment (collaboration-network
  CN-08, ambient-profile Plan 10) via a merge-threshold sweep.

hypothesis: >
  Pre-registered in PROTOCOL.md. H1 every invariant zero in every arm; H2 prompt
  w2 (standard names, no descriptions, plus a generic-term validator) raises the
  primary metric by >= 0.05 over w1 and lowers method splits; H3 no wrong merge
  at 0.92; H4 field ruler >= 0.9; H5 Q1 recall >= 0.9 and precision >= 0.8.
  OUTCOME: all five hold. Primary 0.658 -> 0.775 (+0.117), splits 38 -> 16, no
  wrong merge at any threshold from 0.80 to 0.95; first harm at 0.80.

