id: EXP-2026-11-004
slug: fulltext-coverage
title: Full-text coverage of the paper corpus from free sources
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-08
date_completed: 2026-11-08
authors: [Brendon (with Claude, Opus 5.5)]

purpose: >
  First measurement of the new full-text tool (tools/fulltext): what fraction of
  the live corpus's papers it retrieves as full text on this instance as
  configured (no publisher keys, no contact email), and from which sources.
  Supports no paper claim; it sizes the tool for the stance and hypothesis
  engines that will read full papers.

hypothesis: >
  Between 25% and 45% of sampled papers come back as full text, with PubMed
  Central the largest single source (stated in PROTOCOL.md before the run).

