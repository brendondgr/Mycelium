id: EXP-2026-09-018
slug: ambient-harm-checks-sandbox
title: "Do the ambient harm checks read zero on a clean record and catch each violation they exist for?"
status: complete
date_started: 2026-09-19
date_completed: 2026-09-19
authors: [brendondgr]

purpose: >
  Ambient Plan 10's harm checks are the pilot's go/no-go gate. This checks
  that each reads zero on a record the real pipeline produced and catches the
  one violation it exists for without firing on anything else.

hypothesis: >
  H1 every check zero on the sandbox record except the question cap, whose
  hits must all be harness-made (written after one look, stated); H2 11/11
  injected violations each raise exactly their own check by one, 0
  cross-talk; H3 under 10 minutes. OUTCOME: H1 holds (7 cap hits, all
  EXP-2026-09-015/016 harness asks on a Saturday); H2 holds (11/11, 0
  cross-talk); H3 holds (4.5 s).

