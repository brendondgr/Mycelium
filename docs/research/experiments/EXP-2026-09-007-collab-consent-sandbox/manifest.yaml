id: EXP-2026-09-007
slug: collab-consent-sandbox
title: Is anyone ever findable who should not be? A synthetic-world test of plan CN-04
status: complete # planned | running | complete | failed | superseded
date_started: 2026-09-18
date_completed: 2026-09-18
authors: [brendondgr]

purpose: >
  The sandbox validation plan CN-04 must pass before it is retired: a consent
  matrix planted on EXP-2026-09-005's world, every rule of being findable
  checked exhaustively against an independent reference, and a simulated week
  of searches to test the appearance cap.

hypothesis: >
  Pre-registered in PROTOCOL.md: every violation counter is zero (verified
  scope, mutual visibility, refusals, expiry, preview, cap); the cap's effect
  on concentration is exploratory. OUTCOME: 0 violations; Gini of distinct
  seekers per open person 0.441 without the cap, 0.038 with it; 75% of
  would-be results withheld in the heavy simulated week.

