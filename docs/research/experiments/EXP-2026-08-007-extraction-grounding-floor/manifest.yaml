id: EXP-2026-08-007
slug: extraction-grounding-floor
title: Source-length-aware grounding floor and its effect on extraction refusal
status: complete # planned | running | complete | failed | superseded
date_started: 2026-08-16
date_completed: 2026-08-16
authors: [brendondgr]

purpose: >
  EXP-2026-08-006 measured a 34.4% refusal rate for the fast extraction arm and
  read it as a model limitation. This tests whether it was instead an artefact
  of an inherited word-overlap floor that is arithmetically unsatisfiable for a
  conference record, and re-measures refusal split by domain.

hypothesis: >
  Stated before the run: (1) conference refusals were near-total and drove the
  headline number while grant refusals were much lower; (2) a source-length-aware
  test collapses refusal, and collapses it most for the fast arm, which was being
  punished hardest by a test it could not pass; (3) the apparent speed/coverage
  trade-off therefore narrows or vanishes.
  OUTCOME: all three confirmed. Grant refusal is 0.0% in every arm after the fix;
  ungrounded_prose fell from 37 occurrences to zero while grants kept the identical
  0.45 floor; fast-arm refusal fell 34.4% -> 3.1%.

