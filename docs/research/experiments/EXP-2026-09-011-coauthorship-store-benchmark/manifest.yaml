id: EXP-2026-09-011
slug: coauthorship-store-benchmark
title: Postgres recursive queries or Neo4j for the co-authorship graph? Latency at 1,000, 5,000 and 20,000 people
status: complete # planned | running | complete | failed | superseded
date_started: 2026-09-18
date_completed: 2026-09-18
authors: [brendondgr]

purpose: >
  Plan CN-07 step 5: whether the co-authorship walks (network, distances,
  introduction paths) can stay in Postgres at realistic size, or need Neo4j.

hypothesis: >
  Pre-registered: Postgres p95 <= 250 ms per walk at 20,000 people (H1); zero
  disagreement between Postgres, Neo4j and a Python BFS (H2). OUTCOME: H1 holds
  (introduction p95 31.6 ms; 60 ms worst walk in the exploratory hub arm); H2
  holds (0 disagreements).

