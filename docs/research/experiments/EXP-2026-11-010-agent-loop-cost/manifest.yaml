# EXP-2026-11-010 — machine-readable record. metrics.values are copied from
# data/metrics.json by a script; nothing is typed.

id: EXP-2026-11-010
slug: agent-loop-cost
title: "Mylo agent: latency and tokens of a 1-, 5- and 15-step tool loop, and of real questions"
status: complete # attempt 1 (2026-11-09) failed on a dead endpoint; attempt 2 (2026-11-12/13) complete
date_started: 2026-11-09
date_completed: 2026-11-13
authors: [Claude (agent), Brendon (owner)]

purpose: >
  The Mylo agent plan's Phase 0 gate: before the agent ships, measure the
  latency and tokens per turn of a tool loop of 1, 5 and 15 model calls against
  the instance's real endpoint on this host, so the step cap, context window
  and model choice can be changed if a typical turn is too slow. Tests C-030.

hypothesis: >
  A 5-step turn completes in under 60 seconds and under 30k tokens on the
  instance model; a 15-step turn stays under the default 32k context window
  without compaction. Stated before any run.

code:
  commit: 5685ac8c # A2 pre-registration. A1 r1 at 5ff4274b, A2 a2 at 5685ac8c, A1 r2idle and a2idle at 11154a1b–dbd45e82, a2idle2 at 62e52ec3, a3c4 at d5b9b51f, a3c8 at 5431382d, a3p4/a3p8 and their repeats at b53d87a5–c9fbb4fc, a4s10 at ad46274a; agent code identical across them (only research files changed)
  branch: main
  entrypoint: "docker compose run --rm --no-deps -T backend uv run --no-sync --project web/backend python docs/research/experiments/EXP-2026-11-010-agent-loop-cost/code/run.py (A1); … code/run_a2.py --reps 3 --tag <run> (A2); python3 … code/analyse.py"
  dirty: true # the operator's uncommitted landing-page edits; no agent code
config:
  path: "tools/agent/tool.py (defaults: max_steps 25, result_cap_tokens 4000, context window 32768)"
  hash: null
data:
  name: "A1: scripted function results; A2: 12 fixed questions in the public demo world (code/questions_a2.json)"
  version: "demo world fixture_version 1, built 2026-11-10"
  split: n/a
  n_examples: 12 # questions; 504 A2–A4 turns in all
  qrels: null
  hash: null
  card: null
seeds: []
n_runs: 3

environment:
  python: "3.13"
  lockfile: web/backend/uv.lock
  container: "one-off backend containers (ghcr.io/astral-sh/uv:python3.13-bookworm @ sha256:47965cdc…)"
compute:
  hardware: "Intel Xeon Silver 4114 host (sc-zeus), 62 GB; model Qwen 3.8 27B on vLLM, one A100 80GB, remote via the instance relay"
  wall_clock_hours: 1.0
  estimated_cost_usd: 0

llm:
  model: "local/Qwen 3.8 27B (relay name default-model)@2026-11-12"
  temperature: 0.2
  max_tokens: 0 # the agent sends no output cap
  prompt_files: ["tools/agent/prompt.py", "docs/research/experiments/EXP-2026-11-010-agent-loop-cost/code/run.py"]
  prompt_hash: null
  total_input_tokens: 0 # per-turn totals are in metrics; not summed here
  total_output_tokens: 0
  nondeterminism_note: >
    Sampling at the instance temperature; three repetitions per question and
    two A2 runs show the spread (idle vs under the nightly's load).

