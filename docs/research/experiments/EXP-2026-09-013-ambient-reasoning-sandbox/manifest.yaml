id: EXP-2026-09-013
slug: ambient-reasoning-sandbox
title: Does ambient Plan 04 find what people said, decide the right outcome, and keep every privacy promise? Four weeks of model-written lab conversation with planted truth
status: complete # planned | running | complete | failed | superseded
date_started: 2026-09-19
date_completed: 2026-09-19
authors: [brendondgr]

purpose: >
  Plan 04 (ambient reasoning agent) sandbox validation: extraction recall and
  kind accuracy, decision accuracy, false suggestions, and eleven privacy harm
  checks, on a synthetic three-lab world with planted statements.

hypothesis: >
  Pre-registered: H1 all harm checks zero; H2 recall >= 0.70; H3 kind accuracy
  >= 0.80 and colleague read as self <= 0.20; H4 outcome accuracy >= 0.75 and
  false-suggestion rate <= 0.05; H5 explained >= 0.90; H6 < 60 min, <= 16
  concurrent model calls. OUTCOME (run 3): H1, H2, H4, H5, H6 hold; H3 fails
  (0.585). Post hoc run 5: kind 0.772, outcome 0.894, false suggestions 0.

