id: EXP-2026-08-008
slug: retrieval-ladder-splade-colbert-llm
title: Does a learned-sparse channel, a late-interaction reranker, a cross-encoder, or an LLM reranker beat BM25 on LongEval-Sci?
status: complete
date_started: 2026-08-21
date_completed: 2026-08-21
authors: [brendondgr]

purpose: >
  EXP-2026-08-001 established that nothing in the deployed stack beats BM25 alone
  on nDCG@10 on this collection, refuting C-010, and EXP-2026-08-002 measured that
  the dense-restricted pool costs recall a union pool recovers (C-008). Neither
  says whether the plateau is a property of the task or of the components. This
  experiment adds the four stages the field's 2026 default would add — SPLADE as a
  third retrieval channel, ColBERT as a late-interaction reranker, a cross-encoder
  reranker, and an LLM reranker — to the same code on the same frozen document set,
  and measures each rung against the one below it. It also produces the first
  measurement of position bias in LLM reranking on this stack, which W11 has
  carried as unaddressed.

hypothesis: >
  Stated before the SPLADE and ColBERT arms ran, and partially after the
  cross-encoder and LLM arms did — every prediction is individually labelled
  [PRE] or [POST] in PROTOCOL.md, and ISSUES.md §1 says which is which.
  [PRE] SPLADE beats BM25, because it performs the automatic corpus-aware query
  expansion the hand-authored keyword clusters do manually; the stated falsifier
  was SPLADE scoring below BM25, with the off-distribution risk (MS MARCO training
  vs scientific abstracts) written down in advance.
  [PRE] ColBERT reranking beats the fusion base it reranks.
  [PRE] Effectiveness rises with rerank depth and saturates somewhere.
  OUTCOME: the SPLADE hypothesis was falsified as written — splade_only scores
  0.2617 nDCG@10 against BM25's 0.3212. But as a third RRF channel it produced the
  highest recall on the ladder (R@100 0.7141), and a cross-encoder over that
  wider pool is the best arm measured, so the falsification is of "SPLADE is a
  better retriever here", not of "SPLADE is useless here".

