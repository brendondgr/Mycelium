  commit: 917ec38
  branch: main
  entrypoint: "uv run --project eval python eval/run.py --collection sci-2026-train --config eval/configs/{bm25_only_pooled,dense_only,fusion_dense_pool,fusion_union_pool,fusion_full,splade_only,fusion_bm25_dense_splade,colbert_rerank_d*,xenc_rerank_d*,cascade_colbert_xenc,xenc_rerank_splade_base,fusion_union_pool_p500,xenc_rerank_p500_d*,llm_rerank,llm_rerank_reversed,llm_rubric}.toml"
  dirty: true # the ladder harness itself was uncommitted; apps.content unchanged. ISSUES.md §2
config:
  path: eval/configs/
  hash: null
data:
  name: LongEval-Sci (CLEF)
  version: "longeval-sci-2026/snapshot-1/train, 869,902 docs"
  split: train
  n_examples: 100
  qrels: dctr
  hash: null
  card: null
seeds: []
n_runs: 1

environment:
  python: "3.14"
  lockfile: eval/uv.lock
  container: null
compute:
  hardware: "32 CPU cores, 121 GB RAM, no CUDA device (every neural model runs as ONNX on CPU)"
  wall_clock_hours: 4.5
  estimated_cost_usd: null

# --- LLM block ---------------------------------------------------------------
llm:
  model: "skynet (local relay, OpenAI-compatible; upstream identity not pinned)"
  temperature: 0.0
  max_tokens: 1024
  prompt_files: [eval/harness/llm_rerank.py]
  prompt_hash: null
  total_input_tokens: 0
  total_output_tokens: 0
  nondeterminism_note: >
    Provider-side nondeterminism remains at temperature 0, and n_runs is 1, so no
    variance is reported. The upstream model behind the `skynet` relay alias is
    not pinned — a re-run may reach a different model. This is exactly the gap
    audit item W1 is about, and it is unresolved here. Production defaults to
    temperature 0.2, so even the counterfactual is measured off production's
    setting (ISSUES.md §6).

