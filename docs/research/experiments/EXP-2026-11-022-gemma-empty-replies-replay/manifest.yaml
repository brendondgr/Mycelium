id: EXP-2026-11-022
slug: gemma-empty-replies-replay
title: "Gemma 4 31B empty replies: the 2026-11-15 code replayed against today's server"
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-18
date_completed: 2026-11-18
authors: [Claude Opus 5.5 (agent), on behalf of the maintainer]

purpose: >
  Q-070 / Q-088: why Gemma 4 31B ended many Mylo turns blank on 2026-11-15
  (EXP-2026-11-016, EXP-2026-11-019 round two) but none on 2026-11-17. Replays
  the 11-15 code, frozen, against today's server; then the 11-17 code; then the
  11-15 code with its model calls unstreamed. Bears on C-055 (consistent; no
  status change).

hypothesis: >
  Registered before the run: the blanks come from our 11-15 request (most
  likely a call to a function the request did not offer, dropped by the
  server) and reproduce with the 11-15 code against today's server; if they
  do not (<= 1 of 108), the server changed.

