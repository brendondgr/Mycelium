id: EXP-2026-09-003
slug: typesafe-personal-opportunities
title: Does a calibrated decision model agree with the fused order and the LLM verdicts on one reader's grant and conference slates?
status: complete # planned | running | complete | failed | superseded
date_started: 2026-09-17
date_completed: 2026-09-17
authors: [brendondgr]

purpose: >
  First use of TypeSafe's Jev decision model in this repository, on the smallest
  real thing it can be judged against: one reader's current grant and
  conference slates, 57 (theme, item) pairs across three declared themes. Each
  pair is sent once with three typed questions — a four-level fit Score whose
  levels are the product's own read/skim/file/skip verdicts, a worth Noul, and
  an area question (grant eligibility or conference venue fit). The record
  compares the answers with the two system outputs it already holds for every
  pair, the fused slate position and the prose model's stored verdict, and
  measures cost, latency and determinism from the API's own usage block. No
  relevance judgements exist; the reader's reading of tables/*.md is the next
  step and is a preference, not a label. Bears on C-004 (calibration half),
  C-016 (pointwise discrimination) and C-026.

hypothesis: >
  Pre-registered in PROTOCOL.md before any call. PRIMARY: TypeSafe's argmax fit
  level agrees exactly with the stored LLM verdict on >= 50% of pairs and within
  one step on >= 85%; falsifier: exact agreement <= 30%. SECONDARY (a prior, no
  falsifier): Kendall tau between fused position and worth averages 0.1-0.5 per
  theme. DETERMINISM: repeated calls on five pairs differ by <= 0.01 in worth;
  falsifier: any difference > 0.05.
  OUTCOME: exact agreement 0.561 (bar met, falsifier far), within-one 0.772 (bar
  missed; 13 pairs two or more steps apart, TypeSafe mostly the harsher judge).
  Tau +0.062 mean, range -0.244 to +0.356: below the prior — fused order and
  worth are uncorrelated on these slates. Worth repeat spread 0.03 (between bar
  and falsifier; single-run numbers stand with that caveat); fit-score spread
  0.13 on the 0-3 scale. Distinct fit scores per ten-item theme 9.17 against the
  1.99 of the LLM rubric in EXP-2026-08-008.

