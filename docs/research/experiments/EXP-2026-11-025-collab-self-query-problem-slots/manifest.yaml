id: EXP-2026-11-025
slug: collab-self-query-problem-slots
title: One problem slot per listed topic in typed collaborator questions (Q-102)
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-19
date_completed: 2026-11-19
authors: [Claude (agent)]

purpose: >
  After EXP-2026-11-024's fix, 3 of 14 faculty still saw nobody (Q-102). The
  typed-text prompt asked for at most one problem slot, and only problem slots
  feed the in-field lane that self-queries reach. Commit 77166b9e asks for one
  problem slot per listed topic. This run asks the same 14 questions with the
  previous and the new prompt, back to back on EXP-2026-11-024's copy, and
  counts seekers with at least one suggestion.

hypothesis: >
  Stated before the run (PROTOCOL.md). H1: more problem slots per seeker with
  the new prompt. H2: at least as many seekers with a suggestion, and longer
  in-field shortlists; F09 expected to stay at zero.

