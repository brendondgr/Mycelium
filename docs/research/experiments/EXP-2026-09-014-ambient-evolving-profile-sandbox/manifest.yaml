id: EXP-2026-09-014
slug: ambient-evolving-profile-sandbox
title: Does the evolving profile keep its promises over eight simulated weeks, and do exploration themes stay beside the declared ones?
status: complete # planned | running | complete | failed | superseded
date_started: 2026-09-19
date_completed: 2026-09-19
authors: [brendondgr]

purpose: >
  Plan 05 (ambient evolving profile) sandbox validation: nightly invariants
  over eight simulated weeks with simulated answers, fading, deletion, and the
  exploration-theme ranking hook on a templated corpus.

hypothesis: >
  Pre-registered: H1 zero invariant violations every night; H2 fading exactly
  at two half-lives; H3 at weight 0.15 declared slate Jaccard >= 0.95,
  exploration slate precision >= 0.60, mean displaced from top 25 <= 1; H4 <
  60 min. OUTCOME (run 3): H1 fails (1, deleted evidence cited until the next
  night; fixed, run 4: 0); H2 holds; H3 Jaccard and displacement hold,
  precision fails as registered (0.16, capped by the corpus; post hoc own
  papers at top 1.0); H4 holds.

