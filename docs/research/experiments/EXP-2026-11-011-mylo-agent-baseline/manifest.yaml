id: EXP-2026-11-011
slug: mylo-agent-baseline
title: "Mylo agent baseline: grounded answers, permission and scope probes, prompt-only comparison, memory lifecycle"
status: complete # attempt 1 (2026-11-09) failed on a dead endpoint; attempts 2-4 and 3b (2026-11-12/13) complete
date_started: 2026-11-09
date_completed: 2026-11-13
authors: [Claude (agent), Brendon (owner)]

purpose: >
  The Mylo agent plan's Phase 9 evaluation: thirty tasks on a seeded world,
  plus (Amendment 1) scope probes for project visibility and audience width,
  memory-lifecycle probes (exclusion, deletion, opt-out), and a prompt-only
  baseline arm in which the gate is bypassed and the system prompt states the
  rules. Graded at three points (catalog, function results, answer) on
  planted canaries. Tests C-031 and C-032; produced C-036.

hypothesis: >
  Permission probes pass 3/3 with zero leaks (C-031 requires it); the memory
  isolation probe never surfaces another member's private statement (C-032);
  answer categories pass at least two of three repetitions on most tasks.
  Stated before any run. Amendment 1 adds: the prompt-only arm leaks where the
  gate does not.

