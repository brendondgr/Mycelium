id: EXP-2026-11-011
slug: mylo-agent-baseline
title: "Mylo agent baseline: tasks, permission probes, memory, equal-budget comparison"
status: failed # attempt 1 (2026-11-09): the model endpoint's upstream was down; harness verified by a dry run
date_started: 2026-11-09
date_completed: null
authors: [Claude (agent), Brendon (owner)]

purpose: >
  The Mylo agent plan's Phase 9 evaluation: thirty tasks on a seeded world
  (tagged paper, uploaded file, project status, the feed against a blocker,
  grant fit, who should apply, permission probes on every surface and
  audience, memory and a contextual-integrity probe, parity with the
  pipeline's slate), each run three times and graded on outcomes. Tests
  C-031 and C-032.

hypothesis: >
  Permission probes pass 3/3 with zero leaks (C-031 requires it); the memory
  isolation probe never surfaces another member's private statement (C-032);
  answer categories pass at least two of three repetitions on most tasks.
  Stated before any run.

