id: EXP-2026-11-023
slug: collab-live-fsu-sc
title: Collaborator suggestions for a real department's faculty, for rating by someone who knows them
status: running # planned | running | complete | failed | superseded
date_started: 2026-11-18
date_completed: null
authors: [Claude (agent), maintainer (rater, pending)]

purpose: >
  The demo paper says collaborator search was tested on invented people only and
  that we do not know whether it suggests people a researcher would contact. This
  run puts the 14 core faculty of one real department (anonymous ids F01-F14)
  through the matcher, each asking who in the department to collaborate with on
  their own research areas, on a copy of the live database with their papers
  imported through the product's own path, and produces a rating sheet for the
  maintainer (who knows everyone) using EXP-2026-09-012's "would you contact this
  person?" (yes/maybe/no) measure. Suggestions generated; ratings pending.

hypothesis: >
  Exploratory - no prior hypothesis on the rating. Structural expectations from
  the code (PROTOCOL.md): people without read papers cannot be suggested;
  lab-mates and existing co-authors are never suggested.

