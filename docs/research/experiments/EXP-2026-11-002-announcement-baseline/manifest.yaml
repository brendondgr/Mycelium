id: EXP-2026-11-002
slug: announcement-baseline
title: Announcement measures baseline and department lab-fit floor
status: complete
date_started: 2026-11-05
date_completed: 2026-11-05
authors: [brendondgr]

purpose: >
  Plan Phase 8: measure what opportunity announcements are doing (Interested and
  Remind me rates, Not-for-us reasons, web link clicks, route health, held-back
  reasons) and the department path (reason mix, slate yield, lab-fit scores)
  before any threshold is tuned. Supports C-029; raises Q-055 and Q-056.

hypothesis: >
  Exploratory for engagement (no real users yet). Stated expectation: bge-small
  cosines are compressed, so the lab-fit floor 0.45 admits every department-level
  call and does not discriminate. OUTCOME: held. All nine calls admitted for PULSE
  Lab, three unsuited (precision 0.667); the groups overlap (lowest suiting
  0.568, highest unsuited 0.599). Floor unchanged per the decision rule.

