id: EXP-2026-11-003
slug: tools-refactor-parity
title: "Tools refactor: ranking parity before and after the code moves"
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-08
date_completed: 2026-11-08
authors: [brendondgr]

purpose: >
  Check that the modular-tools refactor (docs/plans/modular-tools/) — moving
  the ranking stack and the scraper out of apps/content and apps/scraper into
  tools/ — changes no ranking the evaluation harness produces. A guard for a
  code move, not a test of any claim in CLAIMS.md.

hypothesis: >
  The decompressed TREC run files are byte-identical before and after every
  phase that moves ranking code, because no expression in the ranking path
  changes.

