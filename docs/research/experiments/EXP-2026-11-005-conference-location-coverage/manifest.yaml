id: EXP-2026-11-005
slug: conference-location-coverage
title: Conference location and continent coverage
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-08
date_completed: 2026-11-08
authors: [Brendon (with Claude, Opus 5.5)]

purpose: >
  Sizes Phase 1 of the Discord forum plan (full conference location and a
  continent forum tag): how many live conferences get a continent and a
  country-bearing location line from geography.place_for, against the shipped
  logic. Supports no paper claim; it checks a product change.

hypothesis: >
  Before about 42% have a continent; after at least 70%; every venue-only line
  becomes the full place text (stated in PROTOCOL.md before the run).

