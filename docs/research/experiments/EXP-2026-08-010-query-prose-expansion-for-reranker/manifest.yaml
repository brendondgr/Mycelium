id: EXP-2026-08-010
slug: query-prose-expansion-for-reranker
title: Does an LLM prose expansion of the query rescue the cross-encoder on short queries?
status: complete
date_started: 2026-08-21
date_completed: 2026-08-22
authors: [brendondgr]

purpose: >
  EXP-2026-08-009 refuted C-013 and located the cross-encoder's damage on short
  keyword queries (1 word -0.053, 2 words -0.051, 3-4 words -0.108) with no harm
  at 5+ words. If length is the mechanism, the fix is cheap and keeps BM25: leave
  retrieval on the original short query and hand only the RERANKER an LLM-written
  prose description of it. This tests that at four target lengths, and tests the
  obvious second mechanism (an English-only reranker over a multilingual corpus)
  from the same run files. Both are refuted.

hypothesis: >
  Pre-registered: PROTOCOL.md was written before any rerank arm ran.
  PRIMARY: effectiveness rises monotonically with expansion length; by ~20-40
  words the deficit against bm25_only closes to within noise or turns positive.
  FALSIFIER, stated in advance: the ~40-word arm remains significantly below
  bm25_only, or the trend is flat or non-monotonic.
  OUTCOME: falsified on both counts. Every length is significantly worse than the
  raw query and the trend is monotonically DOWNWARD -- -0.0439 raw, -0.0790 at
  8w, -0.0875 at 16w, -0.0921 at 20w, -0.0939 at 40w, every interval excluding
  zero. Expansion also broke the one bucket that was previously unharmed (5+ word
  queries, +0.0016 -> -0.0552). The secondary language hypothesis is refuted too:
  harm is LARGEST where the candidate set is entirely Latin-script.

