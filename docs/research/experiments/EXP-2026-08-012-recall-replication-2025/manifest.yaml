id: EXP-2026-08-012
slug: recall-replication-2025
title: Do the ladder's surviving recall claims replicate on sci-2025-01?
status: complete
date_started: 2026-08-22
date_completed: 2026-08-22
authors: [brendondgr]

purpose: >
  Q-024. C-008, C-014 and the exploratory C-018 were the ladder's only surviving
  positive findings and all three rested on one snapshot with click-derived
  judgments -- the same exposure that let the cross-encoder flip sign between
  snapshots in EXP-2026-08-009. This recomputes all three on sci-2025-01: 492
  queries, released human assessments. All three replicate. One adjacent claim
  made in EXP-2026-08-011 -- that the three-channel pool beats bm25_only -- does
  not, and is withdrawn.

hypothesis: >
  Pre-registered before any arm on this snapshot was scored. PRIMARY: all three
  replicate -- same sign, intervals excluding zero, per-query records on the same
  side. SECONDARY: C-008's effect should be LARGER here because the dense channel
  is weaker on this snapshot, so confining BM25 to the dense pool costs more.
  OUTCOME: primary confirmed for all three. C-008 +0.2459 [+0.2196, +0.2717],
  302W/21L; C-014 +0.0330 [+0.0231, +0.0433], 106W/26L; C-018 -0.0219
  [-0.0338, -0.0104], 48W/94L. Secondary confirmed: C-008 is ~5x larger here.
  Unpredicted: on this snapshot both gains also move nDCG@10 with intervals
  excluding zero, where on 2026 they were recall-only. And the adjacent
  three-channel-beats-BM25 claim fails (+0.0111 [-0.0020, +0.0244], spans zero).

