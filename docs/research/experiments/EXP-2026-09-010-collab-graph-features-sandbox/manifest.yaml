authors: [brendondgr]

purpose: >
  Plan CN-07's sandbox validation: introductions, outside my network, team
  formation and wider scopes, against planted truth and brute force.

hypothesis: >
  Pre-registered (amended pre-run): H1 zero invariant violations; H2 team
  cover precision >= 0.80. OUTCOME: H1 holds; H2 fails as registered (0.742);
  0.995 post hoc with covers certified by concepts only.

