id: EXP-2026-11-012
slug: d3-lite-batched-throughput
title: d3-lite throughput when pairs share a forward pass
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-09
date_completed: 2026-11-09
authors: [brendondgr]

purpose: >
  Fairness correction. EXP-2026-11-008 measured d3-lite's concurrency only
  through GAIFA's decide server, whose per-call lock and GPU lease serialize
  requests, and EXP-2026-11-009 then compared it with llama.cpp's 8 parallel
  slots. This run lets d3-lite work on K pairs per forward pass outside the
  server (arm A) and measures llama.cpp on the real states at 1/4/8 in flight
  (arm B, added after arm A), so both models are compared like for like.

hypothesis: >
  Stated before the run: batching K pairs into one d3-lite pass raises
  throughput nearly in proportion at small K, above 20 pairs/s at K=8 on the
  synthetic state (beating llama.cpp Qwen3-4B's 22.8 would refute the earlier
  ranking), with batched answers within 1e-3 of sequential.
  OUTCOME: refuted. Synthetic K=8 / K=1 = 1.32x; real states flat (2.22-2.50
  pairs/s). Real-state parity 0.035. But arm B showed llama.cpp is also flat on
  real states (1.50-1.80 pairs/s), so d3-lite is 1.39x faster there; the
  EXP-009 llama.cpp lead was a short-state artifact.

