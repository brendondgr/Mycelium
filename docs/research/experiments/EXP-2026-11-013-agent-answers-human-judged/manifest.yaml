# EXP-2026-11-013 — machine-readable record. metrics.values are copied from
# data/metrics*.json and data/inject_*_summary.json by a script; nothing is typed.

id: EXP-2026-11-013
slug: agent-answers-human-judged
title: "Mylo answers: human-judged correctness, single-call baseline, and the answer verifier"
status: running # answers, sheets and the people-free measurements are done; the human ratings are pending
date_started: 2026-11-12
date_completed: null
authors: [Claude (agent), Brendon (owner)]

purpose: >
  When Mylo answers a PI's question about the lab's field and opportunities,
  do people judge the answer correct and its citations supported; is it better
  than one retrieve-then-answer call at the same token budget; and does the
  code-level answer verifier remove the right things? Tests C-033, C-034 and
  C-035. The people-free half (costs, repair counterfactual, injected-error
  recall) is complete; the ratings are pending.

hypothesis: >
  C-033: majority-correct on at least 70% of questions and at least 85% of
  citations judged supporting. C-034: Mylo beats the single call (paired
  bootstrap interval excluding zero). C-035: removal precision at least 0.9
  and recall at least 0.5. From the code, written before generation: the
  verifier misses details in running prose and unsupported paraphrases.

