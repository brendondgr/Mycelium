id: EXP-2026-11-024
slug: collab-typed-question-rerun
title: Typed-question collaborator search after the slot-reader fix, on the EXP-2026-11-023 department
status: complete # planned | running | complete | failed | superseded
date_started: 2026-11-19
date_completed: 2026-11-19
authors: [Claude (agent)]

purpose: >
  EXP-2026-11-023 found that a typed question ("Who in the department should I
  collaborate with on <research areas>?") gave no slots, and so no suggestion,
  for 7 of 14 real faculty, because the slot reader's prompt was written for
  funding calls. Commit 2cc179d9 gives typed text its own prompt, a fallback
  topic slot and a no_topic message. This run asks the same 14 questions with
  the code before and after that commit on one fresh copy of the live database,
  and counts how many people get at least one suggestion. Answers Q-099.

hypothesis: >
  Stated before the run (PROTOCOL.md). H1: after the fix no search runs with
  zero slots and none is refused no_topic, since every question names a topic
  after "collaborate with ... on". H2: more seekers get at least one suggestion
  after than before on the same copy; no number predicted, ceiling near 023's
  manual arm (12 of 14).

