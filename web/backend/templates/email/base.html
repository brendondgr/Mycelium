{% comment %}
Shell for every Mycelium email. Table layout and inline styles on purpose: mail
clients strip <style> blocks, ignore flexbox and grid, and Outlook renders
through Word. This is the one place in the repo where the modern CSS the app uses
is the wrong tool.

Colours are the light palette from docs/styles.md, written as literal hex because
custom properties do not survive a mail client either. Dark mode is left to the
client's own inversion; forcing it here fights every reader whose client already
handles it.
{% endcomment %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F8F4EC;margin:0;padding:24px 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#FFFDF8;border:1px solid #D9D0BE;border-radius:12px;">
        <tr>
          <td style="padding:28px 32px 8px 32px;">
            <p style="margin:0;font-size:15px;font-weight:600;letter-spacing:0.02em;color:#5E7A3E;">Mycelium</p>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 32px 28px 32px;color:#2E3627;font-size:15px;line-height:1.6;">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 28px 32px;">
            <hr style="border:0;border-top:1px solid #E8E0D1;margin:0 0 16px 0;">
            <p style="margin:0;color:#7F8775;font-size:12px;line-height:1.5;">
              {% block footer %}This message was sent by Mycelium. If it was not meant for you, you can ignore it.{% endblock %}
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
