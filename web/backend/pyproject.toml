[project]
name = "mycelium-backend"
version = "0.1.0"
description = "Django API and orchestration backend for Mycelium."
requires-python = ">=3.13,<3.14"
dependencies = [
    # Floors on aiohttp, cryptography, django, djangorestframework and pypdf are
    # the first releases without the advisories found in the 2026-11-12 audit.
    "aiohttp>=3.14.4,<4.0.0",
    # The full-text tool (tools/fulltext/engine): HTML landing pages -> markdown.
    "beautifulsoup4>=4.12.0,<5.0.0",
    "celery>=5.5.0,<6.0.0",
    # Fernet encryption for OAuth tokens at rest (apps.integrations.fields).
    "cryptography>=46.0.7",
    "django>=5.2.17,<6.0.0",
    "django-cors-headers>=4.7.0,<5.0.0",
    "django-environ>=0.12.0,<1.0.0",
    "djangorestframework>=3.18.2,<4.0.0",
    # The production web server (compose.yaml's backend service).
    "gunicorn>=23.0.0",
    # The full-text tool's HTML parser (BeautifulSoup's "lxml" backend).
    "lxml>=5.0.0,<7.0.0",
    "neo4j>=5.28.0,<6.0.0",
    "numpy>=2.0.0",
    "openai>=1.50.0,<2.0.0",
    # TypeSafe System One (Jev): typed decisions with calibrated probabilities.
    # Prototype only — see apps/core/systemone.py; nothing in production calls it.
    "typesafe-sdk>=0.6.0,<1.0.0",
    "pgvector>=0.3.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pypdf>=6.21.4,<7.0.0",
    # Calendar-correct offset math for reminders (relativedelta clamps 31 Mar −
    # 1 month → 28/29 Feb). Already present transitively; pinned as a direct dep.
    "python-dateutil>=2.9.0,<3.0.0",
    # Parses the CCF Deadlines aggregate (apps.scraper.collect.conferences.
    # adapters.ccf_deadlines fetches https://ccfddl.com/conference/allconf.yml,
    # the single richest source in the open opportunity collector — three
    # ranking systems and a dblp key on all ~353 venues in one request).
    "pyyaml>=6.0.0,<7.0.0",
    "rank-bm25>=0.2.2,<1.0.0",
    "redis>=5.2.0,<6.0.0",
    # The full-text tool's HTTP client (streamed bodies under a wall-clock
    # deadline). Already present transitively; pinned as a direct dep.
    "requests>=2.31.0,<3.0.0",
    # Server-side PDF generation for the daily Discord "Mylo Report" (pure-Python,
    # no system libraries — apps.content.daily_report_pdf).
    "reportlab>=4.2.0,<5.0.0",
    # Model servers (apps/core/llmkit, apps/core/llm_bridge.py): httpx for
    # discovery and health, the Anthropic and Gemini SDKs for those kinds. Both
    # SDKs are imported lazily; a missing one is a reported problem, not a
    # failed start. Ordinary dependencies, not an extra: a plain `uv run`
    # strips extras on this project.
    "httpx>=0.27,<1.0",
    "anthropic>=0.40,<1.0",
    "google-genai>=1.0,<2.0",
]

[project.optional-dependencies]
# Google Scholar author import. Kept optional (and lazily imported) because
# `scholarly` is heavy and rate-limit-prone; OpenAlex/Semantic Scholar need no
# extra. Install with: uv sync --extra scrapers
scrapers = [
    "scholarly>=1.7.0,<2.0.0",
]
# Local article embeddings for the literature-scan RAG store (apps.scraper).
# Kept optional and lazily imported because fastembed pulls the ONNX runtime and
# downloads model weights on first use. Install with: uv sync --extra embeddings
embeddings = [
    "fastembed>=0.8.0,<1.0.0",
    "numpy>=2.0.0",
]
# The same embedder on a CUDA GPU. `fastembed-gpu` imports as `fastembed` (no
# call-site change) but depends on `onnxruntime-gpu`, which is what actually
# exposes CUDAExecutionProvider — the plain `embeddings` extra ships the CPU-only
# runtime, so it can never use the card. The two flavours must never share an
# environment (see [tool.uv] conflicts below): install exactly one with
# `uv sync --extra embeddings` or `uv sync --extra embeddings-gpu`.
# Needs an NVIDIA driver + CUDA 12.x runtime on the host; in Docker the service
# also needs the GPU granted to it (nvidia-container-toolkit).
embeddings-gpu = [
    "fastembed-gpu>=0.8.0,<1.0.0",
    "onnxruntime-gpu>=1.20.0,<2.0.0",
    "numpy>=2.0.0",
]
# Illinois Fellowship Finder scraping (tools/retrieval/fellowships). Kept
# optional and lazily imported because Playwright pulls a browser runtime (needs
# `playwright install chromium`) and only the scrape path uses it — matching
# and API serving need neither. Install with:
# uv sync --extra fellowships && uv run playwright install chromium
fellowships = [
    "playwright>=1.55.0,<2.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2.0,<6.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-django>=4.11.0,<5.0.0",
    "ruff>=0.14.0,<1.0.0",
]

[tool.uv]
package = false
# `fastembed` and `fastembed-gpu` install the same `fastembed` module (and pull
# rival onnxruntime wheels), so resolving both into one environment silently
# breaks provider selection. Make uv refuse it instead.
conflicts = [[{ extra = "embeddings" }, { extra = "embeddings-gpu" }]]

[tool.ruff]
line-length = 88
target-version = "py313"
# Vendored from the llm-integration skill and kept byte-close to upstream so a
# re-vendor is a plain diff (apps/core/llmkit/VENDORED.md).
extend-exclude = ["apps/core/llmkit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
# The open-source opportunity collector (plan: docs/plans/open-opportunity-
# collector.md, Phase 1) and its ported test suite. Both are vendored from an
# external standalone project rather than authored for Mycelium's own line
# length; reflowing ~17k lines of source (plus its ~5k-line test port) to fit
# this repo's 88-column limit would destroy `git diff` against upstream for no
# behavioural gain. Only E501 is forgiven — every real-defect class (F, B,
# E7xx, etc.) still applies, since this tree is otherwise held to the same
# standard as the rest of the backend.
# (Now tools/retrieval/collect/; the same exemption lives in tools/ruff.toml.)

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
# The platform's tests and every tool's (tools/ at the repository root). Run
# with no path arguments from web/backend — `make test` does — so both are
# collected; `config.pytest_plugin` gives them the same suite-wide fixtures.
testpaths = [".", "../../tools"]
pythonpath = [".", "../.."]
addopts = ["-p", "config.pytest_plugin"]
