[project]
name = "mycelium-backend"
version = "0.1.0"
description = "Django API and orchestration backend for Mycelium."
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.10.0,<4.0.0",
    "celery>=5.5.0,<6.0.0",
    "django>=5.2.0,<6.0.0",
    "django-cors-headers>=4.7.0,<5.0.0",
    "django-environ>=0.12.0,<1.0.0",
    "djangorestframework>=3.16.0,<4.0.0",
    "neo4j>=5.28.0,<6.0.0",
    "numpy>=2.0.0",
    "openai>=1.50.0,<2.0.0",
    "pgvector>=0.3.0,<1.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pypdf>=5.0.0,<7.0.0",
    "rank-bm25>=0.2.2,<1.0.0",
    "redis>=5.2.0,<6.0.0",
]

[project.optional-dependencies]
# Google Scholar author import. Kept optional (and lazily imported) because
# `scholarly` is heavy and rate-limit-prone; OpenAlex/Semantic Scholar need no
# extra. Install with: uv sync --extra scrapers
scrapers = [
    "scholarly>=1.7.0,<2.0.0",
]
# Local article embeddings for the literature-scan RAG store (apps.scraper).
# Kept optional and lazily imported because fastembed pulls the ONNX runtime and
# downloads model weights on first use. Install with: uv sync --extra embeddings
embeddings = [
    "fastembed>=0.8.0,<1.0.0",
    "numpy>=2.0.0",
]
# Pivot-RP (ProQuest) grants/conferences scraping (apps.scraper.pivot). Kept
# optional and lazily imported because Playwright pulls a browser runtime
# (needs `playwright install chromium`) and only the best-effort refresh path
# uses it — importing snapshots and matching need neither. Install with:
# uv sync --extra pivot && uv run playwright install chromium
pivot = [
    "playwright>=1.55.0,<2.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2.0,<6.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-django>=4.11.0,<5.0.0",
    "ruff>=0.14.0,<1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
