[project]
name = "mycelium-backend"
version = "0.1.0"
description = "Django API and orchestration backend for Mycelium."
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery>=5.5.0,<6.0.0",
    "django>=5.2.0,<6.0.0",
    "django-cors-headers>=4.7.0,<5.0.0",
    "django-environ>=0.12.0,<1.0.0",
    "djangorestframework>=3.16.0,<4.0.0",
    "neo4j>=5.28.0,<6.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "redis>=5.2.0,<6.0.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2.0,<6.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-django>=4.11.0,<5.0.0",
    "ruff>=0.14.0,<1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
