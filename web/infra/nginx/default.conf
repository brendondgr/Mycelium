map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# This server only ever listens on plain HTTP, so $scheme is always "http" even
# when the public site is HTTPS (a Cloudflare tunnel or public proxy terminates
# TLS in front). Forward what that front-door reported when it reported one, so
# Django's SECURE_PROXY_SSL_HEADER sees the real scheme and builds https:// URLs.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Use Docker's embedded DNS so upstream hostnames re-resolve after container
    # restarts (avoids 502s from stale cached IPs).
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $backend_upstream http://backend:8000;
        # With a variable in proxy_pass, nginx does NOT append the matched URI
        # remainder, so pass the full original URI explicitly.
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Onboarding "Grow my profile" can legitimately run 1-2 min: a Google
        # Scholar scrape (~50s with rate-limit delays) plus the LLM extraction.
        # The default 60s read timeout returns a 504 mid-build, so allow longer.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /admin/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /login {
        proxy_pass http://web:3000/login;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /signup {
        proxy_pass http://web:3000/signup;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Where an invitation link lands. Signed-out, like the reset pages: the
    # recipient may have no account yet, so a missing block here is a 404 in a
    # stranger's inbox — the one place nobody would notice it.
    location /join {
        proxy_pass http://web:3000/join;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Password reset lives on the app, not the landing site. /reset-password in
    # particular is where an emailed link lands, so a missing block here is a 404
    # in someone's inbox rather than a broken page anyone would notice in dev.
    location /forgot-password {
        proxy_pass http://web:3000/forgot-password;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /reset-password {
        proxy_pass http://web:3000/reset-password;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Mycelium Labs, the workspace design playground (`web/app/src/app/labs/`).
    # Exact match: it is one page, and a prefix would swallow any landing path
    # that merely starts with "labs". `next dev` always serves it; a production
    # build 404s it unless MYCELIUM_LABS=1 is set on the web service.
    location = /labs {
        proxy_pass http://web:3000/labs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # The public demo (apps/demo, web/app/src/proxy.ts): /demo is the app's
    # entry page and /demo/<x> renders the workspace page /app/<x> read-only as
    # a fictional lab. With demo.enabled off both are the app's 404, so this
    # block can stay in place whether the demo is on or not. Its API calls go
    # to /api/demo/, which `location /api/` already serves.
    location /demo {
        proxy_pass http://web:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Exact /app (no trailing slash) is the Next.js canonical route. Without this
    # it falls through to `location /` (landing), which 301-redirects to /app/,
    # and Next 308-redirects /app/ back to /app — an infinite loop.
    location = /app {
        proxy_pass http://web:3000/app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /app/ {
        proxy_pass http://web:3000/app/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # The affiliation directory — `web/app/public/data/institutions.json`, the
    # ~10k universities and institutes the sign-up and profile pickers search.
    # It is an app-owned static asset on a path the app does not otherwise own,
    # so without its own block it falls through to `location /` and the landing
    # site answers instead, which the picker can only report as "directory
    # unavailable". Same reason the signed-out routes above each need one.
    location /data/ {
        proxy_pass http://web:3000/data/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /_next/ {
        proxy_pass http://web:3000/_next/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Next serves web/app/public/* at the site root (e.g. /mylo-headshot.webp),
    # but the app itself only lives under /app/ here — everything else falls
    # through to `location /` (landing) below. Try the web app first for any
    # root-level static file; only 404s fall back to landing's own public/
    # assets, so app-only images (the Mylo headshot, the app logo) resolve
    # instead of silently 404ing behind the gateway.
    location ~* ^/[^/]+\.(svg|webp|png|jpe?g|gif|ico)$ {
        proxy_pass http://web:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_intercept_errors on;
        error_page 404 = @landing_static;
    }

    location @landing_static {
        proxy_pass http://landing:4321$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        proxy_pass http://landing:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
