map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Who is the client ─────────────────────────────────────────────────────────
# A front proxy on this machine (a Cloudflare tunnel, Caddy, certbot's nginx)
# reaches this container from loopback or a Docker bridge address. Only those
# may tell us the real client address and scheme; anyone else's
# X-Forwarded-For / X-Forwarded-Proto is ignored, so a client cannot pick the
# address the throttles and lockouts key on, or claim HTTPS over plain HTTP.
# Docker publishes a port by DNAT, so a client on the network keeps its own
# address here and never matches these ranges.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# This server only listens on plain HTTP, so $scheme is "http" even when the
# public site is HTTPS (TLS ends at the front proxy). Believe a forwarded
# "https" only from a trusted front proxy, so Django's SECURE_PROXY_SSL_HEADER
# sees the real scheme.
map "$realip_remote_addr|$http_x_forwarded_proto" $forwarded_proto {
    default                                             $scheme;
    "~^127\.0\.0\.1\|https$"                            https;
    "~^172\.(1[6-9]|2[0-9]|3[01])\.[0-9.]+\|https$"     https;
}

# ── Access log without secrets ────────────────────────────────────────────────
# Log the path only: no query string (reset links carry their token there) and
# no Referer (which repeats another page's query string). Invitation tokens
# live in the path itself, so they are masked.
map $uri $loggable_uri {
    default                          $uri;
    "~^/join/"                       /join/<token>;
    "~^/api/auth/invites/[^/]+(.*)$" /api/auth/invites/<token>$1;
}
log_format mycelium_safe '$remote_addr [$time_local] "$request_method $loggable_uri" '
                         '$status $body_bytes_sent $request_time "$http_user_agent"';

# ── Rate limits ───────────────────────────────────────────────────────────────
# Password guessing, code guessing and mail flooding. Django's own throttles
# sit behind this; this one stops a burst before it reaches the app.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # Use Docker's embedded DNS so upstream hostnames re-resolve after container
    # restarts (avoids 502s from stale cached IPs).
    resolver 127.0.0.11 valid=30s;

    access_log /var/log/nginx/access.log mycelium_safe;
    server_tokens off;

    # Uploads (résumés, the files tool's 25 MB limit) go through /api/ only,
    # which raises this. Everything else is a page or an asset.
    client_max_body_size 1m;

    # Inherited by every location below (none sets its own add_header).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "DENY" always;

    # Sign-in, sign-up, password reset, email codes and invitation links:
    # the endpoints worth guessing at. Regex locations win over the /api/
    # prefix below.
    location ~ ^/api/auth/(login|register|password/reset|email/(verify|check|resend)|invites/) {
        limit_req zone=auth burst=20 nodelay;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    location /api/ {
        client_max_body_size 26m;
        set $backend_upstream http://backend:8000;
        # With a variable in proxy_pass, nginx does NOT append the matched URI
        # remainder, so pass the full original URI explicitly.
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
        # Onboarding "Grow my profile" can legitimately run 1-2 min: a Google
        # Scholar scrape (~50s with rate-limit delays) plus the LLM extraction.
        # The default 60s read timeout returns a 504 mid-build, so allow longer.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Django admin's own sign-in: the same limit as the API's.
    location ~ ^/admin/login {
        limit_req zone=auth burst=20 nodelay;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    location /admin/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    location /login {
        proxy_pass http://web:3000/login;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    location /signup {
        proxy_pass http://web:3000/signup;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    # Where an invitation link lands. Signed-out, like the reset pages: the
    # recipient may have no account yet, so a missing block here is a 404 in a
    # stranger's inbox — the one place nobody would notice it.
    location /join {
        proxy_pass http://web:3000/join;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    # Password reset lives on the app, not the landing site. /reset-password in
    # particular is where an emailed link lands, so a missing block here is a 404
    # in someone's inbox rather than a broken page anyone would notice in dev.
    location /forgot-password {
        proxy_pass http://web:3000/forgot-password;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    location /reset-password {
        proxy_pass http://web:3000/reset-password;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    # Mycelium Labs, the workspace design playground (`web/app/src/app/labs/`).
    # Exact match: it is one page, and a prefix would swallow any landing path
    # that merely starts with "labs". `next dev` always serves it; a production
    # build 404s it unless MYCELIUM_LABS=1 is set on the web service.
    location = /labs {
        proxy_pass http://web:3000/labs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    # The public demo (apps/demo, web/app/src/proxy.ts): /demo is the app's
    # entry page and /demo/<x> renders the workspace page /app/<x> read-only as
    # a fictional lab. With demo.enabled off both are the app's 404, so this
    # block can stay in place whether the demo is on or not. Its API calls go
    # to /api/demo/, which `location /api/` already serves.
    location /demo {
        proxy_pass http://web:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    # Exact /app (no trailing slash) is the Next.js canonical route. Without this
    # it falls through to `location /` (landing), which 301-redirects to /app/,
    # and Next 308-redirects /app/ back to /app — an infinite loop.
    location = /app {
        proxy_pass http://web:3000/app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    location /app/ {
        proxy_pass http://web:3000/app/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    # The affiliation directory — `web/app/public/data/institutions.json`, the
    # ~10k universities and institutes the sign-up and profile pickers search.
    # It is an app-owned static asset on a path the app does not otherwise own,
    # so without its own block it falls through to `location /` and the landing
    # site answers instead, which the picker can only report as "directory
    # unavailable". Same reason the signed-out routes above each need one.
    location /data/ {
        proxy_pass http://web:3000/data/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    location /_next/ {
        proxy_pass http://web:3000/_next/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
    }

    # Next serves web/app/public/* at the site root (e.g. /mylo-headshot.webp),
    # but the app itself only lives under /app/ here — everything else falls
    # through to `location /` (landing) below. Try the web app first for any
    # root-level static file; only 404s fall back to landing's own public/
    # assets, so app-only images (the Mylo headshot, the app logo) resolve
    # instead of silently 404ing behind the gateway.
    location ~* ^/[^/]+\.(svg|webp|png|jpe?g|gif|ico)$ {
        proxy_pass http://web:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP "";
        proxy_intercept_errors on;
        error_page 404 = @landing_static;
    }

    # Django admin's CSS and JS, collected by the backend at start
    # (`collectstatic` into data/static). Nothing else lives under /static/.
    location ^~ /static/ {
        alias /srv/static/;
        access_log off;
    }

    # The public site: `@landing_static` (root-level images the app does not
    # have) and `location /`. Production serves the static `astro build`
    # (landing-static.conf); `make dev` proxies the Astro dev server
    # (landing-dev.conf). compose mounts one of them here.
    include /etc/nginx/mycelium/landing.conf;
}
