# Production: the public site is the static output of `astro build`, which the
# `landing` one-shot writes into the landing-dist volume (mounted read-only at
# /srv/landing). Included by default.conf inside its server block.

# Root-level images the app does not have fall back to the site's own.
location @landing_static {
    root /srv/landing;
    try_files $uri =404;
}

# Astro's hashed bundles never change under one name.
location ^~ /_astro/ {
    root /srv/landing;
    expires 30d;
    try_files $uri =404;
}

location / {
    root /srv/landing;
    index index.html;
    try_files $uri $uri/index.html $uri.html =404;
}
