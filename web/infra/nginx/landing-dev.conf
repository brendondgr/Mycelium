# Development (`make dev`): the public site is the Astro dev server, with hot
# reload over a websocket. Included by default.conf inside its server block;
# compose.dev.yaml mounts this file in place of landing-static.conf.

location @landing_static {
    proxy_pass http://landing:4321$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP "";
}

location / {
    proxy_pass http://landing:4321;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header CF-Connecting-IP "";
}
