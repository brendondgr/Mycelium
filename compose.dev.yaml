# Development overlay: hot-reload servers instead of the production ones.
#
#   make dev      # = ops/mycelium start --dev
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
#
# What changes against compose.yaml:
#   - landing runs `astro dev` (nginx proxies it) instead of a one-shot build;
#   - web runs `next dev` instead of `next build && next start`;
#   - backend runs Django's runserver with DEBUG on;
#   - the dev servers are published on 127.0.0.1 for direct access.
#
# Django refuses to start with DEBUG on while PUBLIC_HOSTNAME is set, so this
# overlay is for a machine that is not serving the public.
services:
  nginx:
    volumes:
      - ./web/infra/nginx/landing-dev.conf:/etc/nginx/mycelium/landing.conf:ro
    depends_on:
      landing:
        condition: service_started

  landing:
    command: sh -c "npm run dev:landing"
    restart: on-failure
    ports:
      - "127.0.0.1:${LANDING_PORT:-11150}:4321"

  web:
    command: sh -c "exec npm run dev:app:docker"
    ports:
      - "127.0.0.1:${WEB_PORT:-11250}:3000"

  backend:
    command:
      - sh
      - -c
      - >-
        uv run --no-sync --project web/backend python web/backend/manage.py migrate --noinput &&
        exec uv run --no-sync --project web/backend python web/backend/manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:${BACKEND_PORT:-11350}:8000"
    environment:
      DJANGO_DEBUG: "True"
      # The Next dev server is also reachable directly on its own port.
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${NGINX_PORT:-11050},http://localhost:${WEB_PORT:-11250}
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:${NGINX_PORT:-11050},http://localhost:${WEB_PORT:-11250}

  worker:
    environment:
      DJANGO_DEBUG: "True"

  beat:
    environment:
      DJANGO_DEBUG: "True"
