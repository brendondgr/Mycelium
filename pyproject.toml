# Root runner environment for the repo-level entry scripts (pivot.py,
# manual_*.py). It mirrors web/backend's runtime dependencies plus the
# `embeddings` (fastembed) and `pivot` (playwright, beautifulsoup4) extras so a
# single `uv run pivot.py all` can scrape, de-duplicate, and recommend in one
# process. web/backend/pyproject.toml remains the source of truth for the app's
# own deps — keep this list in sync when those change.
[project]
name = "mycelium"
version = "0.1.0"
description = "Root runner env for Mycelium entry scripts (pivot.py, manual_*.py)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.10,<4",
    "beautifulsoup4>=4.12,<5",
    "celery>=5.5,<6",
    "django>=5.2,<6",
    "django-cors-headers>=4.7,<5",
    "django-environ>=0.12,<1",
    "djangorestframework>=3.16,<4",
    "fastembed>=0.8,<1",
    "neo4j>=5.28,<6",
    "numpy>=2.0",
    "openai>=1.50,<2",
    "pgvector>=0.3,<1",
    "playwright>=1.55,<2",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=5.0,<7",
    "rank-bm25>=0.2.2,<1",
    "redis>=5.2,<6",
]
