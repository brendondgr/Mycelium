# Root runner environment for the repo-level entry scripts
# (ops/scrapers/scrape_fellowships.py, ops/nightly/manual_*.py). It mirrors web/backend's runtime
# dependencies plus its `embeddings` (fastembed) and `fellowships` (playwright,
# beautifulsoup4) extras — folded in here as plain dependencies rather than
# extras of their own, so a single `uv run ops/scrapers/scrape_fellowships.py scrape` needs
# no separate `uv sync --extra`. web/backend/pyproject.toml remains the source
# of truth for the app's own deps — keep this list in sync when those change.
[project]
name = "mycelium"
version = "0.1.0"
description = "Root runner env for Mycelium entry scripts (ops/scrapers/scrape_fellowships.py, ops/nightly/manual_*.py)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiohttp>=3.10,<4",
    "beautifulsoup4>=4.12,<5",
    "celery>=5.5,<6",
    # Fernet encryption for Discord OAuth tokens at rest (apps.integrations.fields).
    "cryptography>=44,<47",
    # Mylo's persistent Discord bot (mylo/bot/). The stdlib-only error reporter
    # (mylo/reporting.py) does NOT need this — only the gateway process does.
    "discord.py==2.7.1",
    "django>=5.2,<6",
    "django-cors-headers>=4.7,<5",
    "django-environ>=0.12,<1",
    "djangorestframework>=3.16,<4",
    "neo4j>=5.28,<6",
    "numpy>=2.0",
    "openai>=1.50,<2",
    "pgvector>=0.3,<1",
    "playwright>=1.55,<2",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=5.0,<7",
    "rank-bm25>=0.2.2,<1",
    "redis>=5.2,<6",
]

# fastembed comes from a dependency group rather than the dependency list so the
# host runner can pick its flavour. `embeddings-cpu` is synced by default;
# `embeddings-gpu` swaps in the CUDA build (`fastembed-gpu` imports as
# `fastembed`, and `onnxruntime-gpu` is what exposes CUDAExecutionProvider).
# On a CUDA host, install the GPU flavour once:
#     uv sync --no-group embeddings-cpu --group embeddings-gpu
#     uv run python web/backend/manage.py embedding_device --benchmark
[dependency-groups]
embeddings-cpu = ["fastembed>=0.8,<1"]
embeddings-gpu = [
    "fastembed-gpu>=0.8,<1",
    "onnxruntime-gpu>=1.20,<2",
]

[tool.uv]
# The two flavours install the same `fastembed` module and rival onnxruntime
# wheels; sharing one environment silently breaks provider selection.
conflicts = [[{ group = "embeddings-cpu" }, { group = "embeddings-gpu" }]]
default-groups = ["embeddings-cpu"]
